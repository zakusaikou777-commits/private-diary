<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>タスク</title>
<meta name="theme-color" content="#f4ecda" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
:root{
  --paper:#f4ecda; --card:#fdf8ec; --line:#e2d6bd; --ink:#2c2620; --soft:#7a6f5e;
  --red:#c0463c; --red-d:#a3392f; --green:#57845A; --blue:#3E6CA3; --amber:#b3792f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;-webkit-font-smoothing:antialiased}
#shell{max-width:760px;margin:0 auto;padding:14px 14px 90px}
h1{font-family:"Shippori Mincho",serif;font-size:22px;margin:0;display:flex;align-items:center;gap:8px}
.sub{font-size:12px;color:var(--soft);margin:3px 0 0}
header{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
header .grow{flex:1;min-width:0}
.count{font-size:12.5px;color:var(--soft);text-align:right;white-space:nowrap;padding-top:5px}
.count b{color:var(--red-d);font-size:15px}

/* ── 入力 ── */
.capture{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:14px}
.crow{display:flex;gap:8px;align-items:center}
.crow input.t{flex:1;min-width:0;border:none;background:none;font-size:16px;font-family:inherit;color:var(--ink);padding:6px 2px}
.crow input.t:focus{outline:none}
.add{width:44px;height:44px;flex:none;border:none;border-radius:12px;background:var(--red);color:#fdf1e6;font-size:24px;cursor:pointer;line-height:1;box-shadow:0 4px 12px rgba(160,57,47,.3)}
.add:hover{background:var(--red-d)}
.cmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.dbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.dbtn:hover{border-color:var(--red);color:var(--red)}
.dbtn.on{background:color-mix(in srgb,var(--red) 10%,#fff);border-color:var(--red);color:var(--red-d)}
.cdetail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:none}
.cdetail.open{display:block}
.frow{display:flex;gap:7px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.flbl{font-size:11px;font-weight:700;color:var(--soft);min-width:44px}
input[type=date],input[type=time],select,.note-in{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
.note-in{width:100%;min-height:60px;resize:vertical;line-height:1.7}

/* ── 絞り込み ── */
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.f{border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.f.on{background:var(--red);color:#fdf1e6;border-color:var(--red)}
.f .n{font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}

/* ── 一覧 ── */
.gh{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--soft);margin:16px 2px 7px}
.gh.over{color:var(--red-d)}
.item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px}
.item.over{border-color:color-mix(in srgb,var(--red) 45%,var(--line));background:color-mix(in srgb,var(--red) 4%,var(--card))}
.item.done{opacity:.5}
.irow{display:flex;gap:10px;align-items:flex-start}
.ck{width:24px;height:24px;flex:none;border:2px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;margin-top:1px;font-size:14px;line-height:1;color:var(--green);padding:0}
.ck:hover{border-color:var(--green)}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.ib{flex:1;min-width:0}
.it{font-size:15px;font-weight:700;line-height:1.5;word-break:break-word}
.item.done .it{text-decoration:line-through}
.im{font-size:11.5px;color:var(--soft);margin-top:4px;line-height:1.6;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.pill{border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;background:color-mix(in srgb,var(--line) 55%,#fff);color:var(--soft)}
.pill.due{background:color-mix(in srgb,var(--red) 14%,#fff);color:var(--red-d)}
.pill.today{background:color-mix(in srgb,var(--amber) 16%,#fff);color:var(--amber)}
.pill.rep{background:color-mix(in srgb,var(--blue) 12%,#fff);color:var(--blue)}
.pill.cal{background:color-mix(in srgb,var(--green) 14%,#fff);color:var(--green)}
.acts{display:flex;gap:4px;flex:none}
.mini{width:32px;height:32px;border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:8px;cursor:pointer;font-size:13px;display:grid;place-items:center;padding:0;font-family:inherit}
.mini:hover{border-color:var(--red);color:var(--red)}
.edit{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.edit .er{display:flex;gap:6px;justify-content:flex-end;margin-top:9px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.solid{background:var(--red);color:#fdf1e6;border-color:var(--red)}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.solid:hover{background:var(--red-d);color:#fdf1e6}
.empty{text-align:center;color:var(--soft);font-size:13px;padding:26px 10px;line-height:1.9}
.note{font-size:11.5px;color:var(--soft);line-height:1.75;margin:9px 2px 0}
#toast{position:fixed;left:14px;right:14px;bottom:18px;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;z-index:40;display:none}
.gtbox{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.gtauto{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--soft);margin-top:9px;cursor:pointer}
.gtauto input{width:16px;height:16px;accent-color:var(--red)}
#syncWrap{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.tiny{border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:8px;padding:6px 11px;font-family:inherit;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="grow">
      <h1>✓ タスク</h1>
      <p class="sub">やること。終わらせるためのもの。</p>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div class="capture">
    <div class="crow">
      <input class="t" id="nt" placeholder="やることを書く…">
      <button class="add" id="bAdd" aria-label="追加">＋</button>
    </div>
    <div class="cmeta">
      <button class="dbtn" id="qToday">今日</button>
      <button class="dbtn" id="qTomorrow">明日</button>
      <button class="dbtn" id="qWeek">来週</button>
      <button class="dbtn" id="bDetail" aria-expanded="false">期限・繰り返し・メモ</button>
      <span id="qPreview" class="note" style="margin:0"></span>
    </div>
    <div class="cdetail" id="cdetail">
      <div class="frow"><span class="flbl">期限</span>
        <input type="date" id="nDate"><input type="time" id="nTime">
        <button class="dbtn" id="nClear">消す</button>
      </div>
      <div class="frow"><span class="flbl">繰り返し</span>
        <select id="nRep">
          <option value="">なし</option>
          <option value="daily">毎日</option>
          <option value="weekday">平日（月〜金）</option>
          <option value="weekly">毎週</option>
          <option value="monthly">毎月</option>
        </select>
      </div>
      <div class="frow"><span class="flbl">カレンダー</span>
        <label style="font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="nCal" style="width:16px;height:16px;accent-color:var(--red)">Googleカレンダーにも登録する
        </label>
      </div>
      <div class="frow" style="display:block"><span class="flbl">メモ</span>
        <textarea class="note-in" id="nNote" placeholder="補足があれば"></textarea>
      </div>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="f on" data-f="open">未完了 <span class="n" id="cOpen"></span></button>
    <button class="f" data-f="today">今日まで <span class="n" id="cToday"></span></button>
    <button class="f" data-f="over">期限切れ <span class="n" id="cOver"></span></button>
    <button class="f" data-f="none">期限なし <span class="n" id="cNone"></span></button>
    <button class="f" data-f="done">完了 <span class="n" id="cDone"></span></button>
  </div>

  <div id="list"></div>

  <div class="gtbox">
    <label class="gtauto" style="margin-top:0"><input type="checkbox" id="ntf">期限の時刻にお知らせする</label>
    <p class="note" id="ntfNote"></p>
  </div>

  <div class="gtbox">
    <button class="btn" id="bGt">Googleタスクと同期</button>
    <label class="gtauto"><input type="checkbox" id="gtAuto">タスクを変えたら自動で送る</label>
    <p class="note" id="gtNote"></p>
  </div>

  <div id="syncWrap">
    <button id="bSync" class="tiny" type="button">☁ 同期</button>
    <div id="syncPanel" style="display:none;margin-top:9px;font-size:12px;line-height:1.7;color:var(--soft)">
      <div id="syncMsg">—</div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        <button id="bSyncNow" class="tiny" type="button">今すぐ同期</button>
        <button id="bSyncAuto" class="tiny" type="button">自動同期: ON</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="sync.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var KEY="tasks:v1";
var GD_SCOPE="https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/tasks";
var GTASK="https://tasks.googleapis.com/tasks/v1";
var GT_LIST_KEY="tasks:gtaskList";     // 使うリストのID
var GT_SYNC_KEY="tasks:gtaskSync";     // 最後にGoogle Tasksと突き合わせた時刻
var GCAL="https://www.googleapis.com/calendar/v3/calendars/primary/events";

var store=(function(){
  var ok=false,mem={};
  try{var k="__t"+Math.random();localStorage.setItem(k,"1");localStorage.removeItem(k);ok=true;}catch(e){ok=false;}
  return {
    get:function(k){try{if(ok)return localStorage.getItem(k);}catch(e){}return (k in mem)?mem[k]:null;},
    set:function(k,v){try{if(ok){localStorage.setItem(k,v);return;}}catch(e){}mem[k]=v;},
    del:function(k){try{if(ok){localStorage.removeItem(k);return;}}catch(e){}delete mem[k];}
  };
})();
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(m,ms){var e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(function(){e.style.display="none";},ms||3800);}
function uid(){return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function pad(n){return (n<10?"0":"")+n;}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayStr(){return ymd(new Date());}
function addDays(s,n){var p=s.split("-").map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return ymd(d);}

/* ══════ データ ══════ */
var T=[], DEL=[];
try{
  var o=JSON.parse(store.get(KEY)||"null");
  if(o){ if(Array.isArray(o.items))T=o.items; if(Array.isArray(o.deleted))DEL=o.deleted; }
}catch(e){}
/* sync.js が項目に付ける管理用の印。決め打ちのキーだけで作り直すと、この印が
   毎回落ちてしまい、sync.js 側の「一度同期した項目がDriveから消えている＝
   他端末で削除された」という判定が永久に働かなくなる（削除が墓標だけ頼りになる）。
   ここを通しても消さずに持ち越す。 */
var SYNC_FIELDS=["synced"];
function normalize(){
  var now=Date.now();
  T=T.filter(function(x){return x&&x.id;}).map(function(x){
    var o={id:x.id, title:String(x.title||""), note:String(x.note||""),
            date:x.date||"", time:x.time||"", rep:x.rep||"",
            done:!!x.done, doneAt:x.doneAt||0,
            repDay:x.repDay||0,
            repWas:x.repWas||"", repNextId:x.repNextId||"",
            gtaskId:x.gtaskId||"", gtaskUpdated:x.gtaskUpdated||"",
            // Googleアプリ側で消された印。ここで落とすと次の同期で送り直してしまい、
            // 消したはずのタスクが新しいIDで復活する。必ず持ち越す。
            gtUnlinked:x.gtUnlinked?1:0,
            // 前回Googleタスクと揃えられたときの updatedAt（この端末の時計）。
            // 「こちらで直したか」をこれと比べれば同じ時計どうしの比較で済み、
            // Googleサーバとの時差で誤判定しない。旧版の gtPulledAt から引き継ぐ。
            gtSyncedAt:typeof x.gtSyncedAt==="number"?x.gtSyncedAt
                      :(typeof x.gtPulledAt==="number"?x.gtPulledAt:0),
            gcalEventId:x.gcalEventId||"", createdAt:x.createdAt||now,
            updatedAt:typeof x.updatedAt==="number"?x.updatedAt:(x.createdAt||now)};
    SYNC_FIELDS.forEach(function(k){ if(x[k]!==undefined)o[k]=x[k]; });
    return o;
  });
}
normalize();
/* 保存の本体。gtTouch() を呼ばないぶんだけ save() と違う。
   Googleタスク同期の後始末からは必ずこちらを呼ぶ。save() を呼ぶと
   保存→gtTouch→10秒後にgtSync→保存…と、タブを開いている限り止まらない。 */
function persistOnly(){
  try{store.set(KEY,JSON.stringify({items:T,deleted:DEL}));}catch(e){}
  if(sync)sync.touch(true);
  ntfSchedule();
  render();
}
function save(){
  persistOnly();
  gtTouch();
}
function byId(id){for(var i=0;i<T.length;i++)if(T[i].id===id)return T[i];return null;}

/* ══════ 期限の判定 ══════ */
function dueTs(t){
  if(!t.date)return null;
  var p=t.date.split("-").map(Number);
  if(t.time){var q=t.time.split(":").map(Number);return new Date(p[0],p[1]-1,p[2],q[0],q[1]).getTime();}
  return new Date(p[0],p[1]-1,p[2],23,59,59).getTime();
}
function isOver(t){ var d=dueTs(t); return !t.done && d!==null && d<Date.now(); }
function isToday(t){ return !t.done && t.date && t.date<=todayStr(); }
function dueLabel(t){
  if(!t.date)return "";
  var td=todayStr();
  var diff=Math.round((new Date(t.date).getTime()-new Date(td).getTime())/86400000);
  var base = diff===0?"今日" : diff===1?"明日" : diff===-1?"昨日"
           : diff<0?(-diff)+"日前" : diff<7?diff+"日後" : t.date;
  return base+(t.time?" "+t.time:"");
}
var REP_LABEL={daily:"毎日",weekday:"平日",weekly:"毎週",monthly:"毎月"};
/* 繰り返しの次回日を出す。過ぎている場合は未来になるまで進める。
   毎月は「元が何日だったか」を覚えておく。31日を一度28日に丸めたあと、
   その28日を基準に進めると、以降ずっと28日になってしまうため。 */
function nextDate(date,rep,anchorDay){
  if(!date||!rep)return "";
  var d=date, guard=0;
  var anchor = anchorDay || Number(date.split("-")[2]);
  do{
    if(rep==="daily") d=addDays(d,1);
    else if(rep==="weekly") d=addDays(d,7);
    else if(rep==="weekday"){ do{ d=addDays(d,1); }while([0,6].indexOf(new Date(d).getDay())>=0); }
    else if(rep==="monthly"){
      var p=d.split("-").map(Number);
      var last=new Date(p[0],p[1]+1,0).getDate();   // 翌月の末日
      d=ymd(new Date(p[0],p[1],Math.min(anchor,last)));
    } else return "";
    guard++;
  }while(d<todayStr()&&guard<400);
  return d;
}

/* ══════ Googleカレンダー（気になり帳と同じ経路）══════ */
function cidGet(){
  try{
    var v=(store.get("shared:gd:cid")||"").trim();
    if(v)return v;
    return (store.get("kininari:gd:cid")||"").trim();
  }catch(e){ return ""; }
}
function tokCached(){
  try{
    var o=JSON.parse(store.get("shared:gd:token")||"null");
    if(o&&o.token&&o.exp&&Date.now()<o.exp-60000)return o.token;
  }catch(e){}
  return null;
}
function tokCache(t,sec){try{store.set("shared:gd:token",JSON.stringify({token:t,exp:Date.now()+(sec||3600)*1000}));}catch(e){}}
function getToken(interactive){
  var c=tokCached(); if(c)return Promise.resolve(c);
  var cid=cidGet();
  if(!cid)return Promise.reject(new Error("NOCID"));
  return new Promise(function(res,rej){
    if(!(window.google&&google.accounts&&google.accounts.oauth2)){rej(new Error("Googleの読み込みが未完了です"));return;}
    var to=setTimeout(function(){rej(new Error("認証がタイムアウトしました"));},90000);
    try{
      var tc=google.accounts.oauth2.initTokenClient({
        client_id:cid, scope:GD_SCOPE,
        callback:function(r){clearTimeout(to);
          if(r&&r.access_token){tokCache(r.access_token,r.expires_in);res(r.access_token);}
          else rej(new Error("認証に失敗しました"));},
        error_callback:function(){clearTimeout(to);rej(new Error("認証がキャンセルされました"));}
      });
      tc.requestAccessToken({prompt:interactive?"consent":""});
    }catch(e){clearTimeout(to);rej(e);}
  });
}
function calRun(fn){
  return getToken(false).catch(function(){return getToken(true);}).then(function(tk){
    return fn(tk).catch(function(e){
      if(/40[13]/.test(String(e&&e.message||e))){
        store.del("shared:gd:token");
        return getToken(true).then(fn);
      }
      throw e;
    });
  });
}
function calRes(t){
  var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||undefined;
  var r={summary:t.title||"(無題)"};
  if(t.note)r.description=t.note;
  var p=t.date.split("-").map(Number);
  if(t.time){
    var q=t.time.split(":").map(Number);
    var s=new Date(p[0],p[1]-1,p[2],q[0],q[1]);
    var e=new Date(s.getTime()+3600000);
    var f=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":00";};
    r.start={dateTime:f(s),timeZone:tz}; r.end={dateTime:f(e),timeZone:tz};
  } else {
    var e2=new Date(p[0],p[1]-1,p[2]+1);
    r.start={date:t.date}; r.end={date:ymd(e2)};
  }
  return r;
}
function calErrMsg(e){
  var m=String(e&&e.message||e);
  if(/NOCID/.test(m))return "先に ☁ でGoogleドライブのクライアントIDを設定してください。";
  if(/401/.test(m))return "Googleログインが必要です。";
  if(/403/.test(m))return "カレンダーの権限が不足しています。Cloud側でCalendar APIとスコープの設定が必要です。";
  return "カレンダーに登録できませんでした。";
}
function calPush(t){
  if(!t.date){toast("期限がないタスクはカレンダーに登録できません。",4000);return;}
  toast("カレンダーに登録しています…",2500);
  calRun(function(tk){
    var method=t.gcalEventId?"PATCH":"POST";
    var url=t.gcalEventId?(GCAL+"/"+encodeURIComponent(t.gcalEventId)):GCAL;
    return fetch(url,{method:method,headers:{Authorization:"Bearer "+tk,"Content-Type":"application/json"},
      body:JSON.stringify(calRes(t))}).then(function(r){
      if(!r.ok)throw new Error("calendar "+r.status);
      return r.json();
    });
  }).then(function(ev){
    // 通信のあいだにDrive同期が走ると normalize() が T を作り直すので、
    // 手元の t は既に捨てられた古い実体かもしれない。必ずidで引き直して書く。
    var cur=byId(t.id)||t;
    if(ev&&ev.id){cur.gcalEventId=ev.id;cur.updatedAt=Date.now();save();}
    toast("Googleカレンダーに登録しました。",3500);
  }).catch(function(e){ toast(calErrMsg(e),6000); });
}

/* ══════ Google Tasks 連携（双方向）══════
   「前回そろえた時点から、どちら側が変わったか」で決める。時刻の比較は必ず
   同じ物差しどうしで行う。端末の時計とGoogleサーバの時刻を直接比べると、
   時計が数分ずれているだけで判定がひっくり返り、スマホで直した内容を
   古い内容で黙って上書きしてしまうため。
     Google側 : gUpd = g.updated        と seen   = t.gtaskUpdated（どちらもGoogleの時刻）
     こちら側 : lUpd = t.updatedAt      と synced = t.gtSyncedAt  （どちらも端末の時計）
   両方が変わっていたら競合。共通の物差しが無いので大小では決められず、
   「こちらがまだ見ていない新しい情報」であるGoogle側を採り、件数を必ず知らせる。
   Drive同期（PC↔スマホ）とは別系統で、互いに干渉しない。 */
function gtFetch(tk,path,opt){
  opt=opt||{}; opt.headers=opt.headers||{};
  opt.headers.Authorization="Bearer "+tk;
  if(opt.body)opt.headers["Content-Type"]="application/json";
  return fetch(GTASK+path,opt).then(function(r){
    if(r.status===401){store.del("shared:gd:token");throw new Error("401");}
    if(!r.ok)throw new Error("tasks "+r.status);
    return r.status===204?null:r.json();
  });
}
/* 使うリストを決める。既定リストを使い、IDは覚えておく */
function gtListId(tk){
  var c=store.get(GT_LIST_KEY);
  if(c)return Promise.resolve(c);
  return gtFetch(tk,"/users/@me/lists?maxResults=20").then(function(j){
    var it=(j&&j.items)||[];
    if(!it.length)throw new Error("Googleタスクのリストが見つかりません");
    store.set(GT_LIST_KEY,it[0].id);
    return it[0].id;
  });
}
/* 認証 → リストID → 本体、をまとめて面倒みる。
   Googleアカウントを切り替えると、覚えていたリストIDは404を返し続ける。
   404（と、再認証しても駄目だった401）のときは覚えたIDを捨てて一度だけやり直す。 */
function gtRun(fn){
  return getToken(false).catch(function(){return getToken(true);}).then(function(tk){
    return gtListId(tk).then(function(l){ return fn(tk,l); }).catch(function(e){
      var m=String(e&&e.message||e);
      if(!/40[14]/.test(m))throw e;
      store.del(GT_LIST_KEY);
      // 404はリストIDだけが古い（トークンはそのまま使える）。401はトークンごと
      // 無効なので取り直す。どちらもやり直しは一度だけ。
      return (/401/.test(m)?getToken(true):Promise.resolve(tk)).then(function(tk2){
        return gtListId(tk2).then(function(l2){ return fn(tk2,l2); });
      });
    });
  });
}
/* 一覧は1回100件までしか返らない。nextPageToken を辿らないと101件目以降
   （完了ぶんも数に入る）が「Google側から消えた」と誤判定され、紐付けが
   一斉に外れて次の段階で重複登録される。上限に当たったら partial を立て、
   呼び出し側は「消えた」判定を一切しない。 */
var GT_MAX_PAGES=20;
function gtListAll(tk,listId){
  var out=[], pages=0;
  function step(token){
    return gtFetch(tk,"/lists/"+encodeURIComponent(listId)+"/tasks?maxResults=100&showCompleted=true&showHidden=true"
      +(token?("&pageToken="+encodeURIComponent(token)):"")).then(function(j){
      out=out.concat((j&&j.items)||[]);
      pages++;
      var nt=j&&j.nextPageToken;
      if(nt&&pages<GT_MAX_PAGES)return step(nt);
      return {items:out, partial:!!nt};
    });
  }
  return step("");
}
/* Google側へ伝えるべき削除の控え。自動送信がOFFでも、次に同期できたときに必ず送る。
   送り終えたあとも gtaskId は90日残す。Google側に生き残ったタスクが新しいuidで
   取り込み直されて復活するのを防ぐため（ローカルの墓標はidが違うので効かない）。 */
var GT_DEL_KEY="tasks:gtaskDeleted", GT_DEL_TTL=90*24*3600*1000;
function gtDelList(){
  var a=[]; try{a=JSON.parse(store.get(GT_DEL_KEY)||"[]");}catch(e){a=[];}
  if(!Array.isArray(a))a=[];
  var cut=Date.now()-GT_DEL_TTL;
  return a.filter(function(x){return x&&x.gid&&(x.at||0)>cut;});
}
function gtDelSave(a){ try{store.set(GT_DEL_KEY,JSON.stringify(a.slice(-500)));}catch(e){} }
function gtDelAdd(gid){
  if(!gid)return;
  var a=gtDelList(),i;
  for(i=0;i<a.length;i++)if(a[i].gid===gid){a[i].at=Date.now();a[i].sent=0;gtDelSave(a);return;}
  a.push({gid:gid,at:Date.now(),sent:0}); gtDelSave(a);
}
function gtDelMarkSent(gid){
  var a=gtDelList(),ch=false;
  a.forEach(function(x){ if(x.gid===gid&&!x.sent){x.sent=1;ch=true;} });
  if(ch)gtDelSave(a);
}
/* こちら → Google の形へ */
function toGoogle(t){
  var g={title:t.title||"(無題)",status:t.done?"completed":"needsAction"};
  g.notes=t.note||"";
  // Google Tasks の due は日付のみ有効（時刻は保持されない仕様）
  if(t.date)g.due=t.date+"T00:00:00.000Z"; else g.due=null;
  if(!t.done)g.completed=null;
  return g;
}
/* Google → こちらの形へ */
function fromGoogle(g,base){
  var t=base||{id:uid(),time:"",rep:"",repDay:0,gcalEventId:"",createdAt:Date.now()};
  t.title=g.title||"(無題)";
  t.note=g.notes||"";
  t.date=g.due?String(g.due).slice(0,10):"";
  t.done=(g.status==="completed");
  if(t.done){
    // 完了日時はGoogle側の completed を使う。ここを取り込んだ時刻にすると
    // 完了一覧の並びが狂い、「1週間より古い完了は送らない」判定も効かなくなる。
    var ca=g.completed?new Date(g.completed).getTime():0;
    if(!ca||!isFinite(ca))ca=0;
    if(ca)t.doneAt=ca; else if(!t.doneAt)t.doneAt=Date.now();
  }
  if(!t.done)t.doneAt=0;
  t.gtaskId=g.id;
  t.gtaskUpdated=g.updated||"";
  return t;
}
function gtBusy(v,msg){
  var b=$("bGt"); if(!b)return;
  b.disabled=!!v; b.textContent=v?(msg||"連携中…"):"Googleタスクと同期";
}
function gtSync(){
  gtBusy(true);
  return gtRun(function(tk,listId){
   return gtListAll(tk,listId).then(function(res){
    var remote=res.items, partial=res.partial;
    var byGid={}; remote.forEach(function(g){byGid[g.id]=g;});
    var mine={}; T.forEach(function(t){ if(t.gtaskId)mine[t.gtaskId]=t; });
    var ops=[], added=0, updated=0, sent=0, failed=0, conflicts=0, unlinked=0;
    var gone={}; gtDelList().forEach(function(x){ gone[x.gid]=1; });

    // ⓪ 消し損ねていたGoogle側の削除を、自動送信のON/OFFに関わらずここで片付ける。
    //    残したままだと、Google側に生きているタスクが次の同期で取り込み直される。
    gtDelList().forEach(function(x){
      if(x.sent)return;
      ops.push(gtFetch(tk,"/lists/"+encodeURIComponent(listId)+"/tasks/"+encodeURIComponent(x.gid),{method:"DELETE"})
        .then(function(){ gtDelMarkSent(x.gid); })
        .catch(function(e){
          // 既に無い（404/410）なら目的は果たせているので待ち行列から外す
          if(/40[49]|410/.test(String(e&&e.message||e))){ gtDelMarkSent(x.gid); return; }
          failed++;
        }));
    });

    // ① Google側にあってこちらに無い → 取り込む
    remote.forEach(function(g){
      if(mine[g.id])return;
      if(gone[g.id])return;   // こちらで消したもの。uidを変えて戻ってこないよう弾く
      var t=fromGoogle(g);
      // この updatedAt は「取り込んだ時刻」であって利用者の編集ではない。
      // 同じ値を gtSyncedAt にも入れて、あとで見分けられるようにする
      t.updatedAt=Date.now(); t.gtSyncedAt=t.updatedAt;
      T.unshift(t); added++;
    });

    // ② 両方にある → seen/gUpd/lUpd を見て新しいほうを採る
    T.forEach(function(t){
      if(!t.gtaskId)return;
      var g=byGid[t.gtaskId];
      if(!g){
        // 一覧が途中までしか取れていないときは、無いことを「消えた」と読んではいけない
        if(partial)return;
        // Google側から消えた → こちらでも紐付けを外す（タスク自体は残す）。
        // 印は永続させる。今回限りにすると normalize() で落ちて、次の同期で③が
        // 新しいIDで送り直し、Googleアプリで消したはずのタスクが復活する。
        t.gtaskId=""; t.gtaskUpdated=""; t.gtUnlinked=1; unlinked++; return;
      }
      // 再びGoogle側に見つかった（別端末が送り直した等）なら、印は用済み
      if(t.gtUnlinked)t.gtUnlinked=0;
      var gUpd=new Date(g.updated||0).getTime();
      var seen=new Date(t.gtaskUpdated||0).getTime();   // 前回この端末が見たGoogle側の時刻
      var lUpd=t.updatedAt||0;
      var synced=t.gtSyncedAt||0;                       // 前回そろえたときの updatedAt
      // 変わったかどうかは同じ時計どうしでだけ比べる（上の説明を参照）。
      // synced が無い＝この印より前から在るタスク。判断材料が無いので
      // 「直していない」側には倒さず、下の分岐で一度だけ送って印を付ける
      var gChanged=gUpd>seen;
      var lChanged=synced>0&&lUpd>synced;
      if(gChanged){
        // Google側で変わった＝こちらがまだ見ていない情報なので取り込む。
        // 競合していても時刻の大小では決めない（比べられる共通の時計が無い）
        if(lChanged)conflicts++;
        fromGoogle(g,t); t.updatedAt=Date.now(); t.gtSyncedAt=t.updatedAt; updated++;
      } else if(lChanged||!synced){
        // こちらだけ変わった（か、まだ一度も印が付いていない）→ 送る。
        // 変わっていないのに送ると、そのたびGoogle側の updated が進み、それを見た
        // 別の端末がまた取り込む…と無意味な往復が続くので送らない
        var sentUpd=lUpd;
        ops.push(gtFetch(tk,"/lists/"+encodeURIComponent(listId)+"/tasks/"+encodeURIComponent(t.gtaskId),
          {method:"PATCH",body:JSON.stringify(toGoogle(t))})
          .then(function(g2){
            // 通信中にDrive同期が T を作り直しているかもしれないので、idで引き直す
            var cur=byId(t.id)||t;
            if(g2){cur.gtaskUpdated=g2.updated||"";}
            // 送れたのは sentUpd 時点の内容。いまの updatedAt を入れると、
            // 通信中に打った編集が「送信済み」扱いになって永久に届かない
            cur.gtSyncedAt=sentUpd; sent++;
          })
          .catch(function(){ failed++; }));
      }
    });

    // ③ こちらにあってGoogleに無い → 送る（完了済みの古いものは除く）
    T.forEach(function(t){
      if(t.gtaskId)return;
      if(t.gtUnlinked)return;    // Googleアプリ側で消されたもの。二度と送り返さない
      if(t.done&&t.doneAt&&Date.now()-t.doneAt>7*86400000)return;  // 1週間前より古い完了は送らない
      var sentUpd2=t.updatedAt||0;
      ops.push(gtFetch(tk,"/lists/"+encodeURIComponent(listId)+"/tasks",
        {method:"POST",body:JSON.stringify(toGoogle(t))})
        .then(function(g2){
          // POSTの返りは必ずidで引き直した実体へ書く。手元の t はDrive同期の
          // normalize() に作り直されて捨てられている場合があり、そこへ書くと
          // gtaskId が消えて次の同期でもう一度POSTしてしまう（重複の元）。
          var cur=byId(t.id)||t;
          if(g2){cur.gtaskId=g2.id;cur.gtaskUpdated=g2.updated||"";}
          // ここで印を付けておかないと、次の同期で「こちらが直した」と読まれ、
          // 送ったばかりの内容をもう一度送り返してしまう
          cur.gtSyncedAt=sentUpd2; sent++;
        })
        .catch(function(){ failed++; }));
    });

    return Promise.all(ops).then(function(){
      // 1件でも送れていないなら最終同期時刻は進めない（次回もう一度試す）
      if(!failed)store.set(GT_SYNC_KEY,new Date().toISOString());
      normalize(); persistOnly();
      var bits=[];
      if(added)bits.push("取り込み "+added+"件");
      if(updated)bits.push("更新 "+updated+"件");
      if(sent)bits.push("送信 "+sent+"件");
      if(conflicts)bits.push("競合 "+conflicts+"件（両方で直したのでGoogle側を採りました）");
      if(unlinked)bits.push("紐付けを外した "+unlinked+"件（Google側で削除。以後は送りません）");
      if(partial)bits.push("一覧が多すぎて途中まで");
      if(failed)toast("Googleタスクへ"+failed+"件を送れませんでした"+(bits.length?"（"+bits.join(" / ")+"）":"")+"。",7000);
      else toast(bits.length?("Googleタスクと同期しました（"+bits.join(" / ")+"）"):"Googleタスクと同期しました。変更はありません。",5000);
    });
   });
  }).catch(function(e){
    var m=String(e&&e.message||e);
    if(/NOCID/.test(m))toast("先に ☁ でGoogleドライブのクライアントIDを設定してください。",6000);
    else if(/401/.test(m))toast("Googleログインが必要です。もう一度お試しください。",5000);
    else if(/403/.test(m))toast("Googleタスクの権限がありません。Cloud ConsoleでTasks APIの有効化と、スコープ（.../auth/tasks）の追加が必要です。",9000);
    else if(/リストが見つかりません/.test(m))toast(m,6000);
    else toast("Googleタスクと同期できませんでした。",5000);
  }).then(function(){
    // 旧版が付けていた今回限りの印が残っていたら掃除する（gtUnlinked へ移行済み）
    T.forEach(function(t){ if(t._gtUnlinked)delete t._gtUnlinked; });
    gtBusy(false);
  });
}

/* ══════ 追加 ══════ */
var detailOpen=false;
function quickSet(d){
  $("nDate").value=d; renderQuick();
}

  var bits=[];

$("qToday").addEventListener("click",function(){quickSet($("nDate").value===todayStr()?"":todayStr());});
$("qTomorrow").addEventListener("click",function(){var d=addDays(todayStr(),1);quickSet($("nDate").value===d?"":d);});
$("qWeek").addEventListener("click",function(){var d=addDays(todayStr(),7);quickSet($("nDate").value===d?"":d);});
$("nClear").addEventListener("click",function(){$("nDate").value="";$("nTime").value="";renderQuick();});
["nDate","nTime","nRep","nCal"].forEach(function(id){$(id).addEventListener("change",renderQuick);});
$("bDetail").addEventListener("click",function(){

function add(){
  var title=$("nt").value.trim();
  if(!title){
    var n=$("nNote").value.trim();
    if(n)title=n.split("\n")[0].slice(0,60);
  }

    detailOpen=true;$("cdetail").classList.add("open");$("nDate").focus(); return;
  }
  var t={id:uid(),title:title,note:$("nNote").value.trim(),
         date:$("nDate").value||"",time:$("nTime").value||"",rep:$("nRep").value||"",
         repDay:$("nDate").value?Number($("nDate").value.split("-")[2]):0,
         done:false,doneAt:0,gtaskId:"",gtaskUpdated:"",gcalEventId:"",
         createdAt:Date.now(),updatedAt:Date.now()};
  DEL=DEL.filter(function(x){return x.id!==t.id;});
  T.unshift(t);
  var wantCal=$("nCal").checked;
  $("nt").value="";$("nNote").value="";$("nDate").value="";$("nTime").value="";$("nRep").value="";
  detailOpen=false;$("cdetail").classList.remove("open");$("bDetail").classList.remove("on");

$("bAdd").addEventListener("click",add);
$("nt").addEventListener("keydown",function(e){if(e.key==="Enter")add();});

/* ══════ 完了 ══════ */
function toggle(id){
  var t=byId(id); if(!t)return;
  if(!t.done && t.rep && t.date){
    // 繰り返しは、完了したら次回ぶんを作って自分は完了済みにする。
    // 元の繰り返し設定(repWas)と作った次回ぶん(repNextId)を覚えておく。
    // 覚えずに rep を空にすると、完了を取り消したときに元へ戻せず、
    // 繰り返さなくなった元タスクと次回ぶんが二重に残ってしまう。
    var now=Date.now();
    var nd=nextDate(t.date,t.rep,t.repDay);
    var nx={id:uid(),title:t.title,note:t.note,date:nd,time:t.time,rep:t.rep,
            repDay:(t.repDay||Number(t.date.split("-")[2])),
            done:false,doneAt:0,gcalEventId:"",createdAt:now,updatedAt:now};
    T.unshift(nx);
    t.done=true;t.doneAt=now;t.repWas=t.rep;t.rep="";t.repNextId=nx.id;t.updatedAt=now;
    save();
    toast("次回は "+dueLabel({date:nd,time:t.time})+" です。",4000);
    return;
  }
  t.done=!t.done; t.doneAt=t.done?Date.now():0; t.updatedAt=Date.now();
  if(!t.done && t.repWas){
    // 完了の取り消しは、完了時にやったことをそのまま巻き戻す
    t.rep=t.repWas; t.repWas="";
    var nid=t.repNextId; t.repNextId="";
    if(nid){
      var n2=byId(nid);
      // 自動で作っただけで、まだ誰も触っていない次回ぶんだけ引っ込める
      if(n2&&!n2.done&&(n2.updatedAt||0)<=(n2.createdAt||0)){
        if(n2.gtaskId)gtDelAdd(n2.gtaskId);   // Google側へ送っていたら消す予約もする
        T=T.filter(function(x){return x.id!==nid;});
        DEL.push({id:nid,at:Date.now()});
        if(editId===nid)editId=null;
      }
    }
  }
  save();
}

/* ══════ 一覧 ══════ */
var filter="open", editId=null;
function counts(){
  var c={open:0,today:0,over:0,none:0,done:0};
  T.forEach(function(t){
    if(t.done){c.done++;return;}
    c.open++;
    if(isOver(t))c.over++;
    if(isToday(t))c.today++;
    if(!t.date)c.none++;
  });
  return c;
}
function visible(){
  var l=T.slice();
  if(filter==="open")l=l.filter(function(t){return !t.done;});
  else if(filter==="today")l=l.filter(function(t){return isToday(t);});
  else if(filter==="over")l=l.filter(function(t){return isOver(t);});
  else if(filter==="none")l=l.filter(function(t){return !t.done&&!t.date;});
  else if(filter==="done")l=l.filter(function(t){return t.done;});
  if(filter==="done")return l.sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});
  // 期限順。期限なしは末尾へ
  return l.sort(function(a,b){
    var x=dueTs(a),y=dueTs(b);
    if(x===null&&y===null)return (b.createdAt||0)-(a.createdAt||0);
    if(x===null)return 1;
    if(y===null)return -1;
    return x-y;
  });
}
function groupOf(t){
  if(t.done)return "完了";
  if(!t.date)return "期限なし";
  if(isOver(t))return "期限切れ";
  var td=todayStr();
  if(t.date===td)return "今日";
  if(t.date===addDays(td,1))return "明日";
  if(t.date<=addDays(td,7))return "今週";
  return "この先";
}
/* 編集フォームは render() のたびに保存済みの値から作り直される。裏で走った同期
   （Drive 3秒 / Googleタスク 10秒）が途中で render() を呼ぶと、打ちかけの文字が
   消えてしまうので、開いている編集欄の中身とカーソル位置だけ持ち越す。 */
var EDIT_FIELDS=["eTitle","eDate","eTime","eRep","eNote"];
/* いま画面に出ている編集フォームが「どのタスクのものか」。editId を見ては駄目で、
   ✎ の切り替えは「editId を書き換えてから render()」の順なので、grabEdit の時点の
   editId はもう次のタスクを指している。それを鵜呑みにすると、DOMに残っている前の
   タスクの値を次のタスクのフォームへ書き戻し、保存で別タスクを潰してしまう。 */
var editFormId=null;
function grabEdit(){
  if(!editFormId)return null;
  var g={id:editFormId, vals:{},focus:"",s:null,e:null},any=false;
  EDIT_FIELDS.forEach(function(id){ var el=$(id); if(el){g.vals[id]=el.value;any=true;} });
  if(!any)return null;
  var a=document.activeElement;
  if(a&&a.id&&EDIT_FIELDS.indexOf(a.id)>=0){
    g.focus=a.id;
    try{ if(typeof a.selectionStart==="number"){g.s=a.selectionStart;g.e=a.selectionEnd;} }catch(err){}
  }
  return g;
}
function restoreEdit(g){
  // 掴んだときと違うタスクの欄には絶対に書き戻さない
  if(!g||!editId||g.id!==editId)return;
  EDIT_FIELDS.forEach(function(id){ var el=$(id); if(el&&id in g.vals)el.value=g.vals[id]; });
  if(!g.focus)return;
  var el=$(g.focus); if(!el)return;
  try{ el.focus(); if(g.s!==null&&el.setSelectionRange)el.setSelectionRange(g.s,g.e); }catch(err){}
}
function render(){
  var keep=grabEdit();
  var c=counts();
  $("cOpen").textContent=c.open; $("cToday").textContent=c.today;
  $("cOver").textContent=c.over; $("cNone").textContent=c.none; $("cDone").textContent=c.done;
  $("count").innerHTML= c.open? ("のこり <b>"+c.open+"</b>"+(c.over?" · 期限切れ "+c.over:"")) : "ぜんぶ完了";

  var l=visible(),h="",lastG="",shownEdit=null;
  if(!l.length){
    h='<div class="empty">'+(T.length?"この条件に合うタスクはありません。":"まだタスクがありません。<br>上の欄に、やることを書いてみてください。")+'</div>';
  } else {
    l.forEach(function(t){
      var g=groupOf(t);
      if(g!==lastG){ h+='<div class="gh'+(g==="期限切れ"?" over":"")+'">'+g+'</div>'; lastG=g; }
      var over=isOver(t);
      h+='<div class="item'+(over?" over":"")+(t.done?" done":"")+'"><div class="irow">'
       + '<button class="ck'+(t.done?" on":"")+'" data-ck="'+t.id+'" aria-label="完了">'+(t.done?"✓":"")+'</button>'
       + '<div class="ib"><div class="it">'+esc(t.title)+'</div><div class="im">';
      if(t.date)h+='<span class="pill'+(over?" due":(t.date===todayStr()?" today":""))+'">'+esc(dueLabel(t))+'</span>';
      if(t.rep)h+='<span class="pill rep">'+REP_LABEL[t.rep]+'</span>';
      if(t.gcalEventId)h+='<span class="pill cal">カレンダー</span>';
      if(t.note)h+='<span>'+esc(t.note.split("\n")[0].slice(0,40))+(t.note.length>40?"…":"")+'</span>';
      h+='</div></div><div class="acts">'
       + (t.date?'<button class="mini" data-cal="'+t.id+'" title="Googleカレンダーに登録">📅</button>':'')
       + '<button class="mini" data-ed="'+t.id+'" title="直す">✎</button>'
       + '<button class="mini" data-del="'+t.id+'" title="削除">🗑</button>'
       + '</div></div>';
      if(editId===t.id){
        shownEdit=t.id;
        h+='<div class="edit">'
         + '<div class="frow"><span class="flbl">名前</span><input class="note-in" style="min-height:0" id="eTitle" value="'+esc(t.title)+'"></div>'
         + '<div class="frow"><span class="flbl">期限</span><input type="date" id="eDate" value="'+esc(t.date)+'"><input type="time" id="eTime" value="'+esc(t.time)+'"></div>'
         + '<div class="frow"><span class="flbl">繰り返し</span><select id="eRep">'
         + ['','daily','weekday','weekly','monthly'].map(function(k){
             return '<option value="'+k+'"'+(t.rep===k?" selected":"")+'>'+(k?REP_LABEL[k]:"なし")+'</option>';}).join('')
         + '</select></div>'
         + '<div class="frow" style="display:block"><span class="flbl">メモ</span><textarea class="note-in" id="eNote">'+esc(t.note)+'</textarea></div>'
         + '<div class="er"><button class="btn" data-ecancel="1">取消</button><button class="btn solid" data-esave="'+t.id+'">保存</button></div></div>';
      }
      h+='</div>';
    });
  }
  $("list").innerHTML=h;
  editFormId=shownEdit;   // いまDOMに出したフォームのタスク（出していなければnull）
  restoreEdit(keep);
  Array.prototype.forEach.call(document.querySelectorAll("#filters .f"),function(b){
    b.classList.toggle("on",b.getAttribute("data-f")===filter);
  });
}
$("list").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  var id;
  if((id=b.getAttribute("data-ck")))return toggle(id);
  if((id=b.getAttribute("data-cal"))){var t=byId(id);if(t)calPush(t);return;}
  if((id=b.getAttribute("data-ed"))){editId=(editId===id?null:id);render();return;}
  if(b.getAttribute("data-ecancel")){editId=null;render();return;}
  if((id=b.getAttribute("data-esave"))){
    var t2=byId(id);
    if(t2){
      var nr=$("eRep").value, nd=$("eDate").value;
      if(nr&&!nd){toast("繰り返しには期限が必要です。",4500);return;}
      t2.title=($("eTitle").value||"").trim()||t2.title;
      // 毎月の基準日は、日付欄を実際に変えたとき（か、まだ基準が無いとき）だけ更新する。
      // 保存のたびに書き換えると、31日のタスクが2月に28日へ丸められたあと
      // 「毎月28日」に固定されてしまい、翌月に元の日付へ戻らなくなる。
      if(nd&&(nd!==t2.date||!t2.repDay))t2.repDay=Number(nd.split("-")[2]);
      t2.date=nd; t2.time=$("eTime").value; t2.rep=nr;
      t2.note=$("eNote").value; t2.updatedAt=Date.now();
    }
    editId=null; save(); return;
  }
  if((id=b.getAttribute("data-del"))){
    var t3=byId(id);
    if(t3&&window.confirm("「"+t3.title+"」を削除しますか？")){
      var gid=t3.gtaskId;
      T=T.filter(function(x){return x.id!==id;});
      DEL.push({id:id,at:Date.now()});
      if(editId===id)editId=null;
      // Googleタスクにも送っていたなら、あちらからも消す。ここで直接消しに行くと
      // 自動送信OFFのときや通信に失敗したときに消し漏れ、次の同期で新しいuidの
      // 別タスクとして戻ってきてしまう（墓標はidが違うので効かない）。
      // 控えに残しておき、次に同期できたときへ持ち越す。
      if(gid)gtDelAdd(gid);
      save();
    }
    return;
  }
});
Array.prototype.forEach.call(document.querySelectorAll("#filters .f"),function(b){
  b.addEventListener("click",function(){filter=b.getAttribute("data-f");editId=null;render();});
});

/* ══════ 気になり帳からの受け取り（#taskadd=…）══════ */
(function(){
  var m=(location.hash||"").match(/(?:#|&)taskadd=([^&]+)/);
  if(!m)return;
  try{
    var p=JSON.parse(decodeURIComponent(m[1]));
    if(p&&p.title){
      var t={id:uid(),title:String(p.title).slice(0,120),note:String(p.note||""),
             date:p.date||"",time:p.time||"",rep:"",done:false,doneAt:0,
             gcalEventId:"",createdAt:Date.now(),updatedAt:Date.now()};
      T.unshift(t); save();
      toast("「"+t.title+"」をタスクにしました。",4500);
    }
  }catch(e){}
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
})();

/* シェル経由でも受け取れるようにする（同じタブが既に開いている場合）*/
window.addEventListener("message",function(e){
  // シェル(index.html)の同一オリジンiframeとして開かれる前提。
  // 誰でも書き込める窓口にしないため、送り元が違えば何もしない。
  if(e.origin!==location.origin)return;
  if(e.data&&e.data.nkSync==="cid"){
    // クライアントIDが変わった＝Googleアカウントごと変わったかもしれない。
    // 覚えていたリストIDは別アカウントでは404を返し続けるので捨てる。
    store.del(GT_LIST_KEY);
    return;
  }
  var p=e.data&&e.data.nkTaskAdd; if(!p||!p.title)return;
  if(T.some(function(x){return !x.done&&x.title===String(p.title).slice(0,120);})){
    toast("同じ名前のタスクが既にあります。",4000); return;
  }
  var t={id:uid(),title:String(p.title).slice(0,120),note:String(p.note||""),
         date:p.date||"",time:p.time||"",rep:"",done:false,doneAt:0,
         gcalEventId:"",createdAt:Date.now(),updatedAt:Date.now()};
  T.unshift(t); save();
  toast("「"+t.title+"」をタスクにしました。",4500);
});

/* ══════ 同期 ══════ */
var sync=null;
function syncGetLocal(){ return {items:T, deleted:DEL}; }
function syncSetLocal(d){
  T=d.items||[]; DEL=d.deleted||[];
  normalize();
  try{store.set(KEY,JSON.stringify({items:T,deleted:DEL}));}catch(e){}
  if(editId&&!byId(editId))editId=null;
  render();
}
function syncMerge(local,remote,lastSync){
  if(!remote)return local;
  var tombs=NKSync.mergeTombs(local.deleted,remote.deleted);
  var items=NKSync.mergeById(local.items,remote.items,lastSync,tombs,"id");
  return {items:items, deleted:tombs};
}
function paintSync(st,auto){
  var b=$("bSync"); if(!b)return;
  b.textContent=st.phase==="error"?"⚠ 同期":"☁ 同期";
  b.style.opacity=st.phase==="syncing"?".45":"1";
  var a=$("bSyncAuto"); if(a)a.textContent="自動同期: "+(auto?"ON":"OFF");
  var m=$("syncMsg"); if(!m)return;
  if(!sync||!sync.hasClientId())m.textContent="まだつながっていません。☁ の設定でGoogleドライブのクライアントIDを入れると使えます。";
  else if(st.phase==="error")m.textContent="⚠️ "+(st.msg||"同期に失敗しました");
  else if(st.phase==="syncing")m.textContent="同期しています…";
  else if(st.phase==="ok")m.textContent="同期しました（"+new Date(st.at).toLocaleTimeString()+"）。";
  else m.textContent="タスクをPCとスマホで揃えます。";
}
if(window.NKSync){
  sync=NKSync.create({app:"tasks",getLocal:syncGetLocal,setLocal:syncSetLocal,merge:syncMerge});
  sync.onChange(paintSync);
  var br=NKSync.bridge({app:"tasks",label:"✓ タスク",hideSel:["#syncWrap"],
    syncNow:function(){return sync.syncNow();},getStatus:function(){return sync.status();}});
  if(br) sync.onChange(function(){br.report();});
  $("bSync").addEventListener("click",function(){var p=$("syncPanel");p.style.display=(p.style.display==="none"?"block":"none");});
  $("bSyncNow").addEventListener("click",function(){sync.syncNow().catch(function(){});});
  $("bSyncAuto").addEventListener("click",function(){sync.setAuto(!sync.autoOn());});
  setTimeout(function(){sync.start();},900);
} else { $("syncWrap").style.display="none"; }

/* ── Googleタスク連携の配線 ── */
var GT_AUTO_KEY="tasks:gtaskAuto", gtTimer=null;
function gtAutoOn(){ return store.get(GT_AUTO_KEY)==="1"; }
function gtPaint(){
  $("gtAuto").checked=gtAutoOn();
  var last=store.get(GT_SYNC_KEY);
  $("gtNote").textContent = last
    ? "最後の連携: "+new Date(last).toLocaleString()+"（完了・期限・メモが双方向で揃います。時刻と繰り返しはこちらだけの情報です）"
    : "Googleタスク（スマホのGoogleタスクアプリなど）と双方向でやりとりします。完了チェックも両方向で揃います。";
}
$("bGt").addEventListener("click",function(){ gtSync().then(gtPaint); });
$("gtAuto").addEventListener("change",function(e){
  store.set(GT_AUTO_KEY, e.target.checked?"1":"0");
  toast(e.target.checked?"タスクを変えると、少し後にGoogleタスクへ送ります。":"自動送信をやめました。",4000);
});
/* 変更から10秒後にまとめて送る（連打で何度も通信しない） */
function gtTouch(){
  if(!gtAutoOn())return;
  if(gtTimer)clearTimeout(gtTimer);
  gtTimer=setTimeout(function(){ gtTimer=null; gtSync().then(gtPaint); }, 10000);
}
gtPaint();

/* ══════ 期限のお知らせ（気になり帳と同じつくり）══════
   通知の予約(TimestampTrigger)は対応ブラウザが限られるので、あるかどうかを
   その都度確かめ、無ければタブを開いている間だけ自分で見に行く。
   タスクごとにタイマーを持つと数が増えたときに電池を食うので、
   タイマーは30秒に1本だけ。時刻まで決めたタスクだけが対象（日付だけのタスクは
   鳴らす瞬間が決まらないため）。 */
var NTF_KEY="tasks:notify";
var ntfOn=(store.get(NTF_KEY)==="1"), ntfSeen={}, ntfInit=false;
function ntfCan(){ return typeof Notification!=="undefined"; }
function ntfTrig(){
  try{ return ("serviceWorker" in navigator)&&ntfCan()&&("TimestampTrigger" in window); }catch(e){ return false; }
}
function ntfSw(){ return ntfTrig()&&Notification.permission==="granted"; }
function ntfAt(t){ if(!t||t.done||!t.date||!t.time)return null; return dueTs(t); }
function ntfBody(t){
  var b=[dueLabel(t)];
  if(t.note)b.push(t.note.split("\n")[0].slice(0,40));
  return b.filter(Boolean).join(" · ");
}
/* 先の予定をまとめてOSに預ける（対応ブラウザのみ）*/
function ntfSchedule(){
  if(!ntfSw())return;
  navigator.serviceWorker.ready.then(function(reg){
    return reg.getNotifications({includeTriggered:true}).then(function(ns){
      var now=Date.now();
      ns.forEach(function(n){
        if(!n.tag||n.tag.indexOf("tasks-")!==0)return;
        // 既に鳴った通知まで閉じると、保存のたびにお知らせが画面から消えてしまう。
        // 予約時刻を data に入れてあるので、まだ先の分だけ取り消す
        var at=(n.data&&n.data.at)||n.timestamp||0;
        if(at>now)n.close();
      });
      if(!ntfOn)return;
      // 期限の近い順に預ける。格納順（作成順）のまま先頭40件だと、
      // 新しいタスクが増えたときに「明日が期限の古いタスク」が漏れる
      var due=[];
      T.forEach(function(t){
        var tt=ntfAt(t);
        if(tt!=null&&tt>now)due.push({t:t,at:tt});
      });
      due.sort(function(a,b){return a.at-b.at;});
      due.slice(0,40).forEach(function(x){   // 先の分まで預けすぎない
        try{
          reg.showNotification("⏰ "+(x.t.title||"タスク"),{
            body:ntfBody(x.t), tag:"tasks-"+x.t.id,
            showTrigger:new TimestampTrigger(x.at), data:{url:location.href, at:x.at}
          });
        }catch(e){}
      });
    });
  }).catch(function(){});
}
function ntfCancel(){
  if(!ntfTrig())return;
  navigator.serviceWorker.ready.then(function(reg){
    return reg.getNotifications({includeTriggered:true}).then(function(ns){
      ns.forEach(function(n){ if(n.tag&&n.tag.indexOf("tasks-")===0)n.close(); });
    });
  }).catch(function(){});
}
function ntfFire(t){
  var shown=false;
  try{
    if(ntfCan()&&Notification.permission==="granted"){
      var n=new Notification("⏰ "+(t.title||"タスク"),{body:ntfBody(t),tag:"tasks-"+t.id});
      n.onclick=function(){ try{window.focus();}catch(e){} n.close(); };
      shown=true;
    }
  }catch(e){}
  // OS通知が使えない/断られている場合は、画面の帯でお知らせする
  if(!shown)toast("⏰ "+(t.title||"タスク")+(ntfBody(t)?"（"+ntfBody(t)+"）":""),9000);
}
function ntfScan(){
  if(ntfSw())return;                           // OSに預けてあるなら二重に鳴らさない
  var now=Date.now();
  T.forEach(function(t){
    var tt=ntfAt(t);
    if(tt==null||tt>now)return;
    var k=t.id+"@"+tt;
    if(ntfSeen[k])return;
    ntfSeen[k]=1;
    // 開いた時点で既に過ぎているぶんは鳴らさない（起動のたびに古い分が鳴らないように）
    if(ntfInit&&ntfOn)ntfFire(t);
  });
  ntfInit=true;
}
function ntfPaint(){
  var c=$("ntf"); if(c)c.checked=ntfOn;
  var p=$("ntfNote"); if(!p)return;
  if(!ntfCan())p.textContent="このブラウザは通知に対応していません。";
  else if(!ntfOn)p.textContent="時刻まで決めたタスクを、その時刻にお知らせします。";
  else if(Notification.permission==="denied")p.textContent="OSの通知は今ブロックされています。開いている間は画面の帯でお知らせします。";
  else if(ntfSw())p.textContent="お知らせします（対応ブラウザではタブを閉じていても届きます）。";
  else p.textContent="このタブを開いている間にお知らせします。";
}
$("ntf").addEventListener("change",function(){
  if(!$("ntf").checked){ ntfOn=false; store.set(NTF_KEY,"0"); ntfCancel(); ntfPaint(); return; }
  if(!ntfCan()){ ntfOn=false; $("ntf").checked=false; ntfPaint(); toast("このブラウザは通知に対応していません。",4000); return; }
  var go=function(perm){
    if(perm==="granted"){
      ntfOn=true; store.set(NTF_KEY,"1"); ntfSchedule();
      toast(ntfTrig()?"期限の時刻にお知らせします。":"このタブを開いている間にお知らせします。",4000);
    } else if(perm==="denied"){
      ntfOn=true; store.set(NTF_KEY,"1");
      toast("OSの通知はブロック中です。開いている間は画面の帯でお知らせします。",6000);
    } else { ntfOn=false; $("ntf").checked=false; }
    ntfPaint();
  };
  // requestPermission は「戻り値がPromise」の新しい形と「コールバック」の古い形がある。
  // 両方に備え、二重に呼ばれないよう一度だけ通す。
  var done=false, once=function(p){ if(done)return; done=true; go(p); };
  if(Notification.permission!=="default"){ once(Notification.permission); return; }
  try{
    var r=Notification.requestPermission(once);
    if(r&&r.then)r.then(once).catch(function(){ once(Notification.permission); });
  }catch(e){ once(Notification.permission); }
});
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){} }
ntfPaint(); ntfScan(); if(ntfOn)ntfSchedule();
setInterval(ntfScan,30000);

renderQuick(); render();
})();
</script>
