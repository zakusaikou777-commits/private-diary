.fr-main { flex:1; min-width:0; display:flex; align-items:center; gap:10px; border:none; background:none; padding:13px 4px 13px 14px; cursor:pointer; font-family:inherit; text-align:left; }
.fr-ic { display:inline-flex; color:var(--c); }
.fr-ic svg { width:20px; height:20px; fill:color-mix(in srgb,var(--c) 14%,#fff); stroke:var(--c); stroke-width:1.6; stroke-linejoin:round; }
.fr-name { font-size:15.5px; font-weight:600; color:var(--ink); display:inline-flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fr-meta { font-size:12px; color:var(--soft); margin-left:auto; white-space:nowrap; }
.fr-chev { display:inline-flex; color:#c5b89d; }
.fr-chev svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; }
.fr-more { flex:none; border:none; background:none; color:var(--soft); font-size:20px; cursor:pointer; padding:0 14px; }
.fr-more:hover { color:var(--ink); }
.pinmark { display:inline-flex; color:var(--red); }
.pinmark svg { width:13px; height:13px; fill:var(--red); stroke:var(--red); stroke-width:1.4; stroke-linejoin:round; }
.pinmark.sm svg { width:11px; height:11px; }

.list { display:grid; grid-template-columns:1fr; gap:11px; align-items:start; }
.empty { grid-column:1 / -1; }
.card { position:relative; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:14px; padding:13px 14px; box-shadow:0 4px 14px rgba(120,95,55,.07); transition:transform .15s, box-shadow .15s, opacity .3s; }
.card:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(120,95,55,.13); }
.card.pinned { background:linear-gradient(180deg,#fffaf0,var(--card)); }
.card.done { opacity:.58; }
.card.done .title { text-decoration:line-through; text-decoration-color:var(--soft); }
@keyframes pop { 0% { transform:scale(.97); box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent); } 100% { transform:none; } }
.card.fresh { animation:pop .9s ease; }
.card-top { display:flex; align-items:center; gap:8px; margin-bottom:7px; flex-wrap:wrap; }
.check { flex:none; width:22px; height:22px; border:1.8px solid #cdbf9f; border-radius:7px; background:#fff; cursor:pointer; padding:0; display:grid; place-items:center; transition:all .15s; }
.check svg { width:14px; height:14px; fill:none; stroke:#fff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; opacity:0; }
.check.on { background:var(--c); border-color:var(--c); }
.check.on svg { opacity:1; }
.tag-pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--soft); font-weight:600; }
.tag-pill .dot { width:7px; height:7px; border-radius:50%; background:var(--c); }
.when { font-size:11.5px; color:var(--red-d); font-weight:600; background:color-mix(in srgb,var(--red) 9%,transparent); padding:2px 8px; border-radius:999px; }
.folder-chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--soft); background:#fff; border:1px solid var(--line); border-radius:999px; padding:2px 9px; }
.folder-chip .dot { width:7px; height:7px; border-radius:50%; background:var(--c,var(--soft)); }
.spacer { flex:1; }
.pin { flex:none; border:none; background:none; cursor:pointer; padding:3px; opacity:.4; transition:opacity .15s; }
.pin svg { width:16px; height:16px; fill:none; stroke:var(--soft); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.pin:hover { opacity:.8; }
.pin.on { opacity:1; }
.pin.on svg { fill:var(--red); stroke:var(--red); }
.title { font-size:16px; line-height:1.5; font-weight:500; word-break:break-word; }
.body { font-size:13.5px; color:var(--soft); margin-top:4px; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
.card-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.linkchip { display:inline-flex; align-items:center; gap:6px; margin-top:9px; font-size:12.5px; color:var(--blue); text-decoration:none; border:1px solid var(--line); background:#fff; border-radius:9px; padding:6px 11px; max-width:100%; }
.linkchip svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; flex:none; }
.linkchip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.linkchip:hover { border-color:var(--blue); background:color-mix(in srgb,var(--blue) 7%,#fff); }
.card-actions { display:flex; align-items:center; gap:8px; margin-top:11px; }
.gcal { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--red-d); text-decoration:none; border:1px solid color-mix(in srgb,var(--red) 35%,var(--line)); background:color-mix(in srgb,var(--red) 6%,#fff); border-radius:9px; padding:6px 11px; transition:all .15s; }
.gcal svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.gcal:hover { background:var(--red); color:#fdf1e6; border-color:var(--red); }
.mini { border:none; background:none; color:var(--soft); font-size:12.5px; cursor:pointer; padding:5px 8px; border-radius:7px; font-family:inherit; }
.mini:hover { background:rgba(120,95,55,.1); color:var(--ink); }
.mini.danger:hover { background:color-mix(in srgb,var(--red) 14%,transparent); color:var(--red-d); }

.card.editing { border-left-color:var(--c); display:flex; flex-direction:column; gap:8px; }
.edit-title { border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:15px; font-family:inherit; color:var(--ink); background:#fff; }
.edit-body { border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:14px; font-family:inherit; color:var(--ink); background:#fff; resize:vertical; }
.edit-title:focus, .edit-body:focus { outline:none; border-color:var(--red); }
.edit-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
.btn { border-radius:9px; padding:8px 16px; font-size:13.5px; cursor:pointer; font-family:inherit; border:1px solid var(--line); }
.btn:disabled { opacity:.5; cursor:default; }
.btn.small { padding:6px 12px; font-size:12.5px; }
.btn.ghost { background:#fff; color:var(--soft); }
.btn.ghost:hover { color:var(--ink); border-color:var(--soft); }
.btn.solid { background:var(--red); color:#fdf1e6; border-color:var(--red); font-weight:600; }
.btn.solid:hover { background:var(--red-d); }
.btn.danger-solid { background:#fff; color:var(--red-d); border-color:color-mix(in srgb,var(--red) 45%,var(--line)); font-weight:700; }
.btn.danger-solid:hover { background:var(--red); color:#fff; border-color:var(--red); }

.datefields { display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; }
.field { display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--soft); }
.field.muted { opacity:.55; }
.field input { border:1px solid var(--line); border-radius:9px; padding:7px 9px; font-size:14px; background:#fff; color:var(--ink); font-family:inherit; }
.field input:focus { outline:none; border-color:var(--red); }
.clear-date { border:1px solid var(--line); background:#fff; color:var(--soft); border-radius:9px; padding:7px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; height:35px; }
.clear-date:hover { color:var(--red); }

.empty { text-align:center; padding:48px 20px; color:var(--soft); }
.empty-mark { font-family:"Shippori Mincho",serif; font-size:46px; color:var(--line); margin-bottom:8px; }
.empty p { white-space:pre-line; line-height:1.7; font-size:14px; margin:0; }
.foot { text-align:center; margin-top:26px; font-size:11.5px; color:#a99c84; }

.drawer-bg { position:fixed; inset:0; background:rgba(44,38,32,.45); backdrop-filter:blur(3px); z-index:60; display:flex; animation:fade .2s; }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
.drawer { width:86%; max-width:340px; height:100%; background:var(--paper); box-shadow:6px 0 30px rgba(0,0,0,.25); display:flex; flex-direction:column; animation:slidein .26s ease; }
@keyframes slidein { from { transform:translateX(-30px); opacity:.5; } to { transform:none; opacity:1; } }
.drawer-head { display:flex; align-items:center; justify-content:space-between; padding:18px 16px 14px; border-bottom:1px solid var(--line); }
.drawer-head h2 { margin:0; font-family:"Shippori Mincho",serif; font-size:18px; display:flex; align-items:center; gap:9px; }
.drawer-head h2 svg { width:18px; height:18px; fill:color-mix(in srgb,var(--red) 12%,#fff); stroke:var(--red); stroke-width:1.6; stroke-linejoin:round; }
.drawer-body { flex:1; overflow-y:auto; padding:12px 10px 30px; }
.drawer-label { font-size:11px; color:var(--soft); font-weight:700; letter-spacing:.05em; margin:16px 8px 6px; display:flex; align-items:center; gap:6px; }
.drawer-empty { font-size:13px; color:var(--soft); padding:6px 10px; }
.tree-row { display:flex; align-items:center; gap:2px; border-radius:9px; min-height:38px; }
.tree-row.active { background:color-mix(in srgb,var(--red) 9%,transparent); }
.tree-row.root { padding:9px 12px; cursor:pointer; border:none; background:none; width:100%; font-family:inherit; font-size:14.5px; color:var(--ink); display:flex; align-items:center; gap:8px; }
.tree-row.root.active { background:color-mix(in srgb,var(--red) 9%,transparent); font-weight:700; }
.all-ic { color:var(--red); font-size:13px; }
.tw { flex:none; width:24px; height:24px; border:none; background:none; cursor:pointer; display:grid; place-items:center; color:var(--soft); transition:transform .15s; }
.tw svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.2; }
.tw.open { transform:rotate(90deg); }
.tw-spacer { width:24px; flex:none; }
.tree-name { flex:1; min-width:0; display:flex; align-items:center; gap:7px; border:none; background:none; cursor:pointer; font-family:inherit; font-size:14px; color:var(--ink); padding:8px 2px; text-align:left; }
.tree-name .dot { width:9px; height:9px; border-radius:50%; flex:none; }
.tree-name .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tree-name .cnt { font-size:11px; color:var(--soft); background:#fff; border:1px solid var(--line); border-radius:999px; padding:0 7px; line-height:17px; }
.tree-more { flex:none; border:none; background:none; color:var(--soft); font-size:18px; cursor:pointer; padding:4px 10px; border-radius:7px; }
.tree-more:hover { background:rgba(120,95,55,.12); color:var(--ink); }
.pinned-row { display:flex; align-items:center; gap:8px; width:100%; border:none; background:none; cursor:pointer; font-family:inherit; font-size:14px; color:var(--ink); padding:8px 12px; border-radius:9px; text-align:left; }
.pinned-row .dot { width:9px; height:9px; border-radius:50%; flex:none; }
.pinned-row.active { background:color-mix(in srgb,var(--red) 9%,transparent); font-weight:700; }
.pinned-row:hover, .tree-name:hover .nm { color:var(--red-d); }
.add-root { margin:14px 8px 0; display:inline-flex; border:1px dashed color-mix(in srgb,var(--red) 40%,var(--line)); background:none; color:var(--red); border-radius:10px; padding:9px 14px; font-size:13.5px; cursor:pointer; font-family:inherit; }
.add-root:hover { background:color-mix(in srgb,var(--red) 7%,transparent); }
.add-root-form { display:flex; gap:6px; align-items:center; margin:14px 8px 0; flex-wrap:wrap; }
.add-root-form input { flex:1; min-width:120px; border:1px solid var(--red); border-radius:10px; padding:9px 11px; font-size:14px; font-family:inherit; }
.add-root-form input:focus { outline:none; }

.modal-bg { position:fixed; inset:0; background:rgba(44,38,32,.45); backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; z-index:70; animation:fade .2s; }
.modal { background:var(--paper); width:100%; max-width:560px; max-height:88vh; border-radius:20px 20px 0 0; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,.25); animation:slideup .28s ease; }
.modal.small { max-width:440px; }
@keyframes slideup { from { transform:translateY(30px); opacity:.6; } to { transform:none; opacity:1; } }
@media (min-width:640px) { .modal-bg { align-items:center; padding:20px; } .modal { border-radius:20px; } }
.modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); background:var(--card); }
.modal-head h2 { margin:0; font-family:"Shippori Mincho",serif; font-size:18px; display:flex; align-items:center; gap:9px; min-width:0; }
.modal-head h2 .dot { width:11px; height:11px; border-radius:50%; flex:none; }
.modal-head h2.ai-title svg { width:18px; height:18px; fill:var(--red); }
.modal-close { border:none; background:none; font-size:26px; color:var(--soft); cursor:pointer; line-height:1; padding:0 4px; flex:none; }
.modal-body { overflow-y:auto; padding:16px 18px 24px; display:flex; flex-direction:column; gap:18px; }

.fa-menu { display:flex; flex-direction:column; gap:4px; }
.fa-btn { border:none; background:#fff; border:1px solid var(--line); color:var(--ink); border-radius:11px; padding:13px 15px; font-size:14.5px; cursor:pointer; font-family:inherit; text-align:left; transition:all .12s; }
.fa-btn:hover { background:var(--card); border-color:var(--soft); }
.fa-btn.danger { color:var(--red-d); }
.fa-btn.danger:hover { background:color-mix(in srgb,var(--red) 8%,#fff); border-color:color-mix(in srgb,var(--red) 40%,var(--line)); }
.fa-form { display:flex; flex-direction:column; gap:10px; }
.fa-form input { border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:15px; font-family:inherit; background:#fff; color:var(--ink); }
.fa-form input:focus { outline:none; border-color:var(--red); }
.fa-move { display:flex; flex-direction:column; gap:5px; }
.fa-target { display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:11px 13px; font-size:14px; cursor:pointer; font-family:inherit; text-align:left; }
.fa-target .dot { width:9px; height:9px; border-radius:50%; flex:none; }
.fa-target .all-ic { color:var(--red); }
.fa-target:hover { background:var(--card); border-color:var(--soft); }
.fa-del p { font-size:14px; line-height:1.7; color:var(--ink); margin:0 0 14px; }

.ai-loading { display:flex; flex-direction:column; align-items:center; gap:14px; padding:46px 0; color:var(--soft); }
.spinner { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--red); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.ai-error { text-align:center; padding:20px 0; color:var(--soft); display:flex; flex-direction:column; gap:14px; align-items:center; }
.ai-sec h3 { margin:0 0 9px; font-size:12.5px; color:var(--soft); font-weight:700; letter-spacing:.05em; }
.ai-summary { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--red); border-radius:12px; padding:13px 15px; font-size:14px; line-height:1.75; }
.ai-note { font-size:13px; color:var(--soft); margin:0; line-height:1.7; }
.ai-tagrow { padding:9px 0; border-bottom:1px dashed var(--line); }
.ai-tagrow:last-of-type { border-bottom:none; }
.ai-tagrow .t { font-size:13.5px; margin-bottom:7px; }
.apply-all { margin-top:10px; }
.ai-grp { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
.ai-grp .gname { font-family:"Shippori Mincho",serif; font-weight:700; font-size:15px; margin-bottom:5px; display:flex; align-items:center; gap:7px; }
.ai-grp .gname .dot { width:9px; height:9px; border-radius:50%; }
.ai-grp .gmembers { font-size:12.5px; color:var(--soft); line-height:1.6; margin-bottom:10px; }
.applied-note { color:var(--green); font-size:12.5px; font-weight:700; }
.ai-foot { font-size:11.5px; color:#a99c84; margin:0; text-align:center; }
.ai-foot a { color:var(--red-d); }
.ai-key { display:flex; flex-direction:column; gap:12px; }
.ai-key h3 { margin:0; font-family:"Shippori Mincho",serif; font-size:17px; }
.ai-key input { border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:15px; font-family:inherit; background:#fff; color:var(--ink); }
.ai-key input:focus { outline:none; border-color:var(--red); }
.linklike { border:none; background:none; color:var(--red-d); cursor:pointer; font-family:inherit; font-size:11.5px; text-decoration:underline; padding:0; }

.head-right { display:flex; align-items:center; gap:8px; flex:none; }
.data-btn { flex:none; width:34px; height:34px; border:1px solid var(--line); background:#fff; border-radius:9px; cursor:pointer; display:grid; place-items:center; color:var(--soft); transition:all .15s; }
.data-btn svg { width:17px; height:17px; }
.data-btn:hover { color:var(--red-d); border-color:color-mix(in srgb,var(--red) 40%,var(--line)); background:color-mix(in srgb,var(--red) 6%,#fff); }
.data-btn.bell.on { color:var(--red-d); border-color:color-mix(in srgb,var(--red) 45%,var(--line)); background:color-mix(in srgb,var(--red) 10%,#fff); }
/* 同期の失敗を黙って隠さない */
.data-btn.sync-err { color:#b3402f; border-color:#e0a99f; background:#fdf0ec; position:relative; }
.data-btn.sync-err:after { content:""; position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:#c0463c; border:1.5px solid var(--card); }
.data-btn.sync-busy { opacity:.55; }
.gd-err { font-size:12.5px; line-height:1.7; color:#8f3325; background:#fdf0ec; border:1px solid #e8c4bb; border-radius:10px; padding:9px 12px; margin:9px 0 0; }
.remind-chip { display:inline-flex; align-items:center; color:var(--red-d); }
.remind-chip svg { width:13px; height:13px; }
.remind-field { margin-top:2px; }
.remind-sel { border:1px solid var(--line); border-radius:9px; padding:7px 9px; font-size:14px; background:#fff; color:var(--ink); font-family:inherit; }
.remind-sel:focus { outline:none; border-color:var(--red); }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:95; display:flex; align-items:center; gap:11px; max-width:calc(100% - 32px); width:max-content; background:var(--ink); color:#f6efdf; border-radius:13px; padding:12px 14px; box-shadow:0 10px 30px rgba(0,0,0,.3); cursor:pointer; animation:toastin .3s ease; }
@keyframes toastin { from { transform:translate(-50%,12px); opacity:0; } to { transform:translate(-50%,0); opacity:1; } }
.toast-ic { flex:none; color:#f0b73f; display:inline-flex; }
.toast-ic svg { width:18px; height:18px; }
.toast-txt { min-width:0; }
.toast-title { font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.toast-body { font-size:12px; color:#d8cdb6; margin-top:1px; }
.toast-x { flex:none; border:none; background:none; color:#bcae93; font-size:20px; line-height:1; cursor:pointer; padding:0 2px; }
.data-tabs { display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:11px; padding:4px; }
.data-tab { flex:1; border:none; background:none; color:var(--soft); border-radius:8px; padding:9px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; }
.data-tab.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(120,95,55,.12); }
.data-pane { display:flex; flex-direction:column; gap:11px; }
.data-actions { display:flex; gap:8px; flex-wrap:wrap; }
.data-json { width:100%; min-height:120px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--ink); background:#fff; resize:vertical; line-height:1.5; }
.data-json:focus { outline:none; border-color:var(--red); }
.data-file { display:inline-flex; align-items:center; justify-content:center; border:1px dashed color-mix(in srgb,var(--red) 40%,var(--line)); color:var(--red-d); border-radius:10px; padding:11px 14px; font-size:13.5px; cursor:pointer; font-family:inherit; }
.data-file input { display:none; }
.data-file:hover { background:color-mix(in srgb,var(--red) 6%,#fff); }
.data-msg { font-size:13px; margin:0; padding:9px 12px; border-radius:9px; }
.data-msg.ok { color:#3f6b46; background:color-mix(in srgb,var(--green) 12%,#fff); border:1px solid color-mix(in srgb,var(--green) 35%,var(--line)); }
.data-msg.err { color:var(--red-d); background:color-mix(in srgb,var(--red) 8%,#fff); border:1px solid color-mix(in srgb,var(--red) 35%,var(--line)); }

/* attachments */
.att-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
.att-thumb { position:relative; width:72px; height:72px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#fff; }
.att-thumb img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; display:block; }
.att-thumb .att-ph { width:100%; height:100%; background:repeating-linear-gradient(45deg,#f0e8d6,#f0e8d6 6px,#e9e0cb 6px,#e9e0cb 12px); }
.att-file { position:relative; display:inline-flex; align-items:center; max-width:100%; }
.att-file-main { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 11px; font-size:12.5px; color:var(--ink); text-decoration:none; max-width:230px; }
.att-file-main:hover { border-color:var(--blue); background:color-mix(in srgb,var(--blue) 6%,#fff); }
.att-file-main svg { width:15px; height:15px; color:var(--soft); flex:none; }
.att-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.att-size { color:var(--soft); font-size:11px; flex:none; }
.att-x { position:absolute; top:-7px; right:-7px; width:21px; height:21px; border-radius:50%; border:none; background:var(--ink); color:#fff; font-size:14px; line-height:1; cursor:pointer; display:grid; place-items:center; box-shadow:0 2px 6px rgba(0,0,0,.25); }
.att-x.file { position:static; margin-left:4px; width:24px; height:24px; background:none; color:var(--soft); box-shadow:none; }

.att-editor { display:flex; flex-direction:column; gap:9px; }
.att-add { display:inline-flex; align-items:center; justify-content:center; align-self:flex-start; border:1px dashed color-mix(in srgb,var(--red) 40%,var(--line)); color:var(--red-d); border-radius:10px; padding:9px 14px; font-size:13px; cursor:pointer; font-family:inherit; }
.att-add:hover { background:color-mix(in srgb,var(--red) 6%,#fff); }

.lightbox { position:fixed; inset:0; background:rgba(20,16,12,.86); z-index:90; display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out; animation:fade .2s; }
.lightbox img { max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5); }

/* links editor + link list */
.links-editor { display:flex; flex-direction:column; gap:7px; }
.link-row { display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 10px; font-size:12.5px; }
.link-row .lr-ic { width:14px; height:14px; color:var(--blue); flex:none; }
.link-row-url { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
.link-row button { border:none; background:none; color:var(--soft); font-size:16px; line-height:1; cursor:pointer; padding:0 2px; flex:none; }

.link-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.link-list .linkchip { margin-top:0; }

/* google drive tab */
.gd-steps { border:1px solid var(--line); border-radius:10px; background:#fff; padding:4px 12px; font-size:13px; color:var(--soft); }
.gd-steps summary { cursor:pointer; padding:8px 0; font-weight:700; color:var(--ink); }
.gd-steps ol { margin:4px 0 10px; padding-left:20px; line-height:1.8; }
.gd-status { display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink); background:color-mix(in srgb,var(--green) 10%,#fff); border:1px solid color-mix(in srgb,var(--green) 30%,var(--line)); border-radius:10px; padding:10px 13px; }
.gd-dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent); flex:none; }
.gd-auto { margin-top:2px; }

/* rich text editor */
/* 旧: .rich に overflow:hidden があり、これがスクロールコンテナ扱いになるため
   .rich-tb の position:sticky が効いていなかった。.rich 自体をスクロール
   コンテナにして、ツールバーが本文の上に留まるようにする。 */
.rich { border:1px solid var(--line); border-radius:12px; background:#fff; max-height:70vh; overflow:auto; }
.rich-tb { display:flex; flex-wrap:wrap; gap:4px; align-items:center; padding:6px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; border-radius:12px 12px 0 0; }
.rich-sel { border:1px solid var(--line); border-radius:7px; padding:5px 6px; font-size:12px; background:#fff; color:var(--ink); font-family:inherit; }
.rich-b { width:30px; height:30px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); cursor:pointer; font-size:13px; display:grid; place-items:center; font-family:inherit; padding:0; }
.rich-b:hover { border-color:var(--red); color:var(--red); }
/* ── 全画面で見る・書く ─────────────────────────────
   カードの中は狭く、本文も表もツールバーも窮屈だった。読むときも書くときも
   画面いっぱいを使う。シェルのiframeの中でも収まるよう、位置は fixed で取る。 */
.kn-full { position:fixed; inset:0; background:rgba(40,32,24,.5); z-index:110; display:flex; align-items:stretch; justify-content:center; padding:0; }
.kn-full-card { background:var(--paper); width:100%; max-width:920px; display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,.35); }
.kn-full-bar { flex:none; display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:3; }
.kn-full-t { flex:1; min-width:0; font-weight:800; font-size:15px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kn-full-b { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:9px; padding:7px 14px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
.kn-full-b:hover { border-color:var(--accent); color:var(--accent); }
.kn-full-b.solid { background:var(--accent); color:#fff; border-color:var(--accent); }
.kn-full-b.solid:hover { color:#fff; opacity:.9; }
.kn-full-x { border:none; background:none; font-size:24px; line-height:1; color:var(--muted); cursor:pointer; padding:2px 6px; }
.kn-full-x:hover { color:var(--accent); }
.kn-full-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px; background:var(--paper); }
/* 全画面の中では、カードの飾り（枠・影・幅の制限）を外して素の紙面にする */
.card.in-full { border:none; box-shadow:none; background:transparent; padding:0; margin:0; max-width:none; cursor:default; }
.card.in-full .memo-rich, .card.in-full .rich-area { font-size:15.5px; line-height:1.9; }
.card.in-full .rich-area { min-height:52vh; }
.card.in-full .rich-tb { position:sticky; top:0; }
.card.in-full .edit-title { font-size:19px; font-weight:800; }
@media (min-width:900px){
  /* 長すぎる行は読みにくいので、本文だけ幅を抑える（表と画像は目一杯使う） */
  .card.in-full .memo-rich > p, .card.in-full .memo-rich > ul, .card.in-full .memo-rich > ol { max-width:34em; }
}
/* ── 文字色・リンク・表 ─────────────────────────────── */
.rich-colors { display:inline-flex; align-items:center; gap:3px; padding:0 3px; }
.rich-sw { width:20px; height:20px; border:1px solid rgba(0,0,0,.18); border-radius:50%; cursor:pointer; padding:0; }
.rich-sw:hover { transform:scale(1.15); }
.rich-note { font-size:12px; color:var(--accent); padding:6px 10px; border-top:1px solid var(--line); }
/* 一覧の抜粋。3行で切って、どのメモも同じくらいの高さに揃える */
.card .title.clip{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow:hidden; word-break:break-word; }
.body.excerpt{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3; overflow:hidden; color:var(--soft); font-size:13px; line-height:1.75; margin-top:4px; word-break:break-word; }
.memo-marks{ display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
.memo-mark{ font-size:10.5px; color:var(--soft); border:1px solid var(--line); border-radius:9999px; padding:1px 8px; background:rgba(0,0,0,.02); }
.kn-attach-err { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:200; max-width:min(92vw,460px); background:var(--accent); color:#fff; font-size:13px; line-height:1.6; padding:11px 15px; border-radius:11px; box-shadow:0 8px 28px rgba(0,0,0,.3); cursor:pointer; }
.tag-add { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:7px; font:inherit; font-size:12px; font-weight:700; padding:4px 10px; cursor:pointer; }
.tag-add:disabled { opacity:.4; cursor:default; }
.tag-add:not(:disabled):hover { border-color:var(--accent); color:var(--accent); }
/* 本文の表。狭い画面でレイアウトを壊さないよう、はみ出す分は横スクロールさせる */
.rich-area table, .memo-rich table { border-collapse:collapse; margin:10px 0; width:auto; max-width:100%; }
.rich-area td, .rich-area th, .memo-rich td, .memo-rich th { border:1px solid var(--line); padding:6px 10px; font-size:13.5px; min-width:56px; vertical-align:top; }
.rich-area th, .memo-rich th { background:rgba(0,0,0,.04); font-weight:700; }
.rich-area, .memo-rich { overflow-x:auto; }
.rich-area a, .memo-rich a { color:#3E6CA3; text-decoration:underline; text-underline-offset:2px; }
/* エディタ内のダイアログ */
.kn-dlg { position:fixed; inset:0; background:rgba(40,32,24,.45); display:flex; align-items:flex-start; justify-content:center; z-index:120; padding:18px; overflow-y:auto; }
.kn-dlg-card { background:var(--paper); border:1px solid var(--line); border-radius:16px; max-width:420px; width:100%; padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.3); margin:auto 0; }
.kn-dlg-h { font-weight:800; font-size:16px; color:var(--ink); margin-bottom:14px; }
.kn-dlg-l { display:block; font-size:12px; font-weight:700; color:var(--muted); margin:10px 0 5px; }
.kn-dlg-i { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font:inherit; font-size:14px; background:#fff; color:var(--ink); }
.kn-dlg-i.num { width:80px; }
.kn-dlg-row { display:flex; gap:14px; align-items:center; }
.kn-dlg-row label { font-size:13px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px; }
.kn-dlg-n { font-size:12px; color:var(--muted); line-height:1.6; margin:10px 0 0; }
.kn-dlg-f { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.kn-dlg-b { border-radius:9px; padding:9px 15px; font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; border:1px solid var(--line); }
.kn-dlg-b.ghost { background:#fff; color:var(--ink); }
.kn-dlg-b.solid { background:var(--accent); color:#fff; border-color:var(--accent); }
.rich-color { width:30px; height:30px; border:1px solid var(--line); border-radius:7px; background:#fff; display:grid; place-items:center; cursor:pointer; position:relative; font-weight:800; color:var(--ink); }
.rich-color input { position:absolute; inset:0; opacity:0; cursor:pointer; }
.rich-area { min-height:240px; padding:12px; font-size:15px; line-height:1.85; color:var(--ink); outline:none; }
.rich-area:empty:before, .rich-area[data-empty="1"]:before { content: attr(data-ph); color:var(--soft); pointer-events:none; }
.rich-area:focus { background:#fffdf8; }
.rich-area h1 { font-size:1.5em; margin:.4em 0; font-family:"Shippori Mincho",serif; font-weight:800; }
.rich-area h2 { font-size:1.28em; margin:.4em 0; font-family:"Shippori Mincho",serif; font-weight:700; }
.rich-area h3 { font-size:1.12em; margin:.35em 0; font-weight:700; }
.rich-area img { max-width:100%; border-radius:8px; display:block; margin:8px 0; }
.rich-area ul, .rich-area ol { padding-left:1.4em; margin:.4em 0; }
.rich-area p { margin:.3em 0; }
/* rich content in card read view */
.memo-rich { font-size:14px; line-height:1.78; color:var(--ink); word-break:break-word; }
.memo-rich h1 { font-size:1.4em; margin:.4em 0; font-family:"Shippori Mincho",serif; font-weight:800; }
.memo-rich h2 { font-size:1.22em; margin:.4em 0; font-family:"Shippori Mincho",serif; font-weight:700; }
.memo-rich h3 { font-size:1.1em; margin:.3em 0; font-weight:700; }
.memo-rich img { max-width:100%; border-radius:8px; display:block; margin:8px 0; }
.memo-rich ul, .memo-rich ol { padding-left:1.4em; margin:.4em 0; }
.memo-rich p { margin:.3em 0; }
.memo-rich a { color:var(--red-d); }

/* google calendar controls */
.gcal-wrap { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
button.gcal { cursor:pointer; font-family:inherit; }
.gcal:disabled { opacity:.55; cursor:default; }
.gcal-ok { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--green); }
.gcal-ok svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.gcal-manual { font-size:11.5px; color:var(--soft); text-decoration:underline; white-space:nowrap; }
.cal-h { width:19px; height:19px; }
.cal-body { display:flex; flex-direction:column; gap:12px; }
.cal-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.cal-item { display:flex; flex-direction:column; gap:2px; border:1px solid var(--line); background:#fff; border-radius:11px; padding:10px 12px; }
.cal-when { font-size:11.5px; color:var(--soft); }
.cal-title { font-size:14.5px; color:var(--ink); text-decoration:none; word-break:break-word; }
.cal-title:hover { color:var(--blue); text-decoration:underline; }

/* ---- responsive: mobile + PC 両用 ---- */
@media (min-width:720px) {
  .controls-top { flex-direction:row; align-items:center; }
  .controls-top .search { flex:1; }
  .controls-top .ai-btn { align-self:center; white-space:nowrap; }
  .folders-list, .list { grid-template-columns:repeat(2, minmax(0,1fr)); }
  /* 画面が広いときは本文欄をさらに広く（従来120px → 360px） */

}
@media (min-width:1024px) {
  .shell { display:flex; align-items:flex-start; }
  .sidebar { display:flex; flex-direction:column; width:280px; flex:none; position:sticky; top:0; height:100vh; border-right:1px solid var(--line); background:linear-gradient(180deg, color-mix(in srgb,#fff 35%, var(--paper)), var(--paper)); }
  .sidebar-head { display:flex; align-items:center; gap:9px; padding:22px 16px 14px; font-family:"Shippori Mincho",serif; font-size:18px; border-bottom:1px solid var(--line); }
  .sidebar-head svg { width:18px; height:18px; fill:color-mix(in srgb,var(--red) 12%,#fff); stroke:var(--red); stroke-width:1.6; stroke-linejoin:round; }
  .sidebar-body { flex:1; overflow-y:auto; padding:10px 10px 30px; }
  .main { flex:1; min-width:0; padding:22px 16px 56px; }
  .folder-btn { display:none; }
  .drawer-bg { display:none; }
}
@media (min-width:1180px) {
  .folders-list, .list { grid-template-columns:repeat(3, minmax(0,1fr)); }
}
/* ── ノート表示（OneNote風）──────────────────────────────────
   左＝フォルダ、中＝ページの一覧、右＝ページ。紙とインクの色はカード表示と同じ。 */
.vs { display:inline-flex; flex:none; gap:2px; padding:2px; border:1px solid var(--line); border-radius:10px; background:#fff; }
.vs-b { border:none; background:none; color:var(--soft); font:inherit; font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:8px; cursor:pointer; white-space:nowrap; }
.vs-b:hover { color:var(--ink); }
.vs-b.on { background:var(--ink); color:#f6efdf; }
@media (max-width:600px) { .head { flex-wrap:wrap; } .vs-b { padding:5px 8px; font-size:12px; } }
.wrap.nv-mode { height:100vh; height:100dvh; min-height:0; overflow:hidden; }
.nv { display:flex; flex-direction:column; height:100%; min-height:0; }
.nv button:focus-visible, .nv select:focus-visible, .nv a:focus-visible, .nv-ov button:focus-visible, .nv-ov select:focus-visible, .nv-ov a:focus-visible { outline:2px solid var(--blue); outline-offset:1px; }
.nv-head { flex:none; display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; padding:8px 12px; background:var(--card); border-bottom:1px solid var(--line); min-width:0; }
.seal.sm { width:30px; height:30px; font-size:17px; border-radius:7px; }
.nv-brand { font-family:"Shippori Mincho",serif; font-weight:800; font-size:17px; letter-spacing:.04em; white-space:nowrap; }
.nv-head .head-right { margin-left:auto; }
.nv-head .counter { padding-top:0; }
.nv-rev { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.nv-rev-b { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:#fff; color:var(--soft); border-radius:999px; padding:4px 11px; font:inherit; font-size:12.5px; cursor:pointer; }
.nv-rev-b b { background:#7c5aff; color:#fff; border-radius:999px; padding:0 6px; font-size:11px; line-height:1.6; }
.nv-rev-b.on { background:#7c5aff; border-color:#7c5aff; color:#fff; }
.nv-rev-b.on b { background:rgba(255,255,255,.25); }
.nv-rev-b.learn b { background:#2e7d52; }
.nv-rev-b.learn.on { background:#2e7d52; border-color:#2e7d52; }
.nv-head .rev-go { padding:4px 12px; font-size:12.5px; }
.nv-icon { flex:none; width:34px; height:34px; border:1px solid var(--line); background:#fff; border-radius:9px; cursor:pointer; display:grid; place-items:center; color:var(--red-d); }
.nv-icon svg { width:15px; height:15px; fill:currentColor; }
.nv-icon:disabled { opacity:.45; cursor:default; }
.nv-body { flex:1; min-height:0; display:flex; }
/* 左: フォルダ（色の付いた見出し） */
.ns { width:var(--lw,240px); flex:none; min-height:0; display:flex; flex-direction:column; background:linear-gradient(180deg, color-mix(in srgb,#fff 35%, var(--paper)), var(--paper)); }
.ns-head { flex:none; display:flex; align-items:center; gap:6px; padding:8px 8px 6px; font-family:"Shippori Mincho",serif; font-size:15px; font-weight:700; }
.ns-ham { flex:none; width:32px; height:32px; border:1px solid transparent; background:none; border-radius:8px; cursor:pointer; font-size:19px; line-height:1; color:var(--ink); display:grid; place-items:center; }
.ns-ham:hover { background:rgba(120,95,55,.1); border-color:var(--line); }
.ns-mini { flex:none; width:44px; display:flex; flex-direction:column; align-items:center; padding-top:8px; background:var(--paper); border-right:1px solid var(--line); }
.ns-body { flex:1; min-height:0; overflow-y:auto; padding:2px 0 28px; }
.ns-row { position:relative; display:flex; align-items:center; gap:2px; margin:1px 6px; border-radius:7px; min-height:34px; }
.ns-row:hover { background:rgba(120,95,55,.07); }
.ns-row.on { background:color-mix(in srgb,var(--c) 15%,#fff); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 32%,transparent); }
.ns-row.over { background:color-mix(in srgb,var(--blue) 16%,#fff); box-shadow:inset 0 0 0 2px var(--blue); }
.ns-tab { position:absolute; left:0; top:4px; bottom:4px; width:5px; border-radius:3px; background:var(--c); }
.ns-row .tw, .ns-row .tw-spacer { width:20px; height:24px; }
.ns-name { flex:1; min-width:0; display:flex; align-items:center; gap:7px; border:none; background:none; cursor:pointer; font:inherit; font-size:14px; color:var(--ink); padding:7px 2px; text-align:left; }
.ns-row.on .ns-name { font-weight:700; }
.ns-name .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ns-name .cnt { margin-left:auto; flex:none; font-size:11px; font-weight:400; color:var(--soft); }
.ns-name .cnt.zero { opacity:.45; }
.ns-ic { flex:none; width:14px; text-align:center; font-size:12px; color:var(--red); }
.ns-more { flex:none; border:none; background:none; color:var(--soft); font-size:16px; cursor:pointer; padding:4px 8px; border-radius:6px; opacity:.55; }
.ns-row:hover .ns-more, .ns-more:focus-visible { opacity:1; }
.ns-more:hover { background:rgba(120,95,55,.12); color:var(--ink); }
.ns-sep { height:1px; background:var(--line); margin:6px 12px; }
.ns-add { margin:12px 10px 0; border:1px dashed color-mix(in srgb,var(--red) 40%,var(--line)); background:none; color:var(--red); border-radius:9px; padding:8px 12px; font:inherit; font-size:13px; cursor:pointer; }
.ns-add:hover { background:color-mix(in srgb,var(--red) 7%,transparent); }
.ns-form { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:12px 10px 0; }
.ns-form input { flex:1; min-width:100px; border:1px solid var(--red); border-radius:9px; padding:7px 9px; font:inherit; font-size:13.5px; }
.ns-form input:focus { outline:none; }
/* 区切り */
.nsplit { flex:none; position:relative; z-index:4; width:7px; margin:0 -3px; cursor:col-resize; touch-action:none; }
.nsplit:after { content:""; position:absolute; top:0; bottom:0; left:3px; width:1px; background:var(--line); transition:background .15s, width .15s, left .15s; }
.nsplit:hover:after, .nsplit.on:after, .nsplit:focus-visible:after { left:2px; width:3px; background:var(--red); }
.nsplit:focus-visible { outline:none; }
/* 中: ページの一覧 */
.npg { width:var(--mw,280px); flex:none; min-height:0; display:flex; flex-direction:column; background:#fbf7ee; }
.npg-top { flex:none; display:flex; flex-direction:column; gap:6px; padding:10px 10px 6px; }
.nv-search { border-radius:10px; padding:0 9px; }
.nv-search input { padding:8px 6px; font-size:14px; min-width:0; }

.nb-text { min-height:1.9em; padding:4px 8px; outline:none; font-size:15px; line-height:1.75; color:var(--ink); word-break:break-word; cursor:text; }

/** 描画中の思わぬ例外で画面が真っ白にならないようにする。落ちた画面は閉じたままにして
 *  （そのあと保存や同期の書き込みが走らない）、理由と再読み込みの手段を出す。

    }, React.createElement("h2", { style: { fontSize: 18, margin: "0 0 8px" } }, "画面を表示できませんでした"),

      React.createElement("p", { style: { margin: "0 0 14px", fontSize: 12, color: "#8a7d6b", wordBreak: "break-word" } }, "原因: ", msg),
      React.createElement("button", {
        type: "button",
        onClick: () => { try { window.location.reload(); } catch (e) {} },
        style: { border: "none", background: "#c0463c", color: "#fff", borderRadius: 9, padding: "9px 18px", fontSize: 14, fontWeight: 700, cursor: "pointer" }

  }
}
