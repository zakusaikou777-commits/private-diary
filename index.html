function DataModal({ data, onImport, onClose, gdCid, gdSync, gdAuto, gdConnected, onGdConnect, onGdPush, onGdPull, onGdSetAuto, onGdDisconnect }) {
  const [tab, setTab] = useState(gdConnected ? "drive" : "export");
  const [paste, setPaste] = useState("");
  const [copied, setCopied] = useState(false);
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [exportJson, setExportJson] = useState(null);
  const [cidInput, setCidInput] = useState(gdCid || "");
  const [gMsg, setGMsg] = useState(null);
  const [gBusy, setGBusy] = useState(false);
  const count = (data.memos || []).length;
  const attCount = (data.memos || []).reduce((n, m) => n + (m.attachments ? m.attachments.length : 0), 0);

  useEffect(() => { let alive = true; (async () => { const o = await buildBackupObject(data.memos, data.notebooks); if (alive) setExportJson(JSON.stringify(o)); })(); return () => { alive = false; }; }, [data]);

  const download = () => {
    if (!exportJson) return;
    try {
      const blob = new Blob([exportJson], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "kininari-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {}
  };
  const shareable = useMemo(() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(["{}"], "a.json", { type: "application/json" })] })); } catch (e) { return false; } }, []);
  const shareFile = async () => {
    if (!exportJson) return;
    try {
      const file = new File([exportJson], "kininari-backup-" + new Date().toISOString().slice(0, 10) + ".json", { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: "気になり帳バックアップ" });
      else download();
    } catch (e) {}
  };
  const copy = async () => {
    if (!exportJson) return;
    try { await navigator.clipboard.writeText(exportJson); setCopied(true); setTimeout(() => setCopied(false), 1500); }
    catch (e) { const ta = document.getElementById("exp-json"); if (ta) { ta.removeAttribute("readonly"); ta.select(); } }
  };
  const onFile = (e) => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { setPaste(String(r.result || "")); setMsg(null); }; r.readAsText(f); };
  const doImport = async () => {
    setMsg(null); setBusy(true);
    try {
      const obj = JSON.parse(paste.trim());
      const memos = Array.isArray(obj.memos) ? obj.memos : null;
      if (!memos) throw new Error("bad");
      const notebooks = Array.isArray(obj.notebooks) ? obj.notebooks : [];
      await restoreBackupFiles(obj.files);
      onImport({ memos, notebooks });
      setMsg({ ok: true, text: `読み込みました（メモ ${memos.length}件${(obj.files || []).length ? ` / 添付 ${(obj.files || []).length}件` : ""}）。この端末のデータは置き換わりました。` });
    } catch (e) { setMsg({ ok: false, text: "読み込めませんでした。バックアップのJSONか確認してください。" }); }
    setBusy(false);
  };

  const gWrap = (fn, okText) => async () => { setGBusy(true); setGMsg(null); try { await fn(); setGMsg({ ok: true, text: okText }); } catch (e) { setGMsg({ ok: false, text: (e && e.message) || "失敗しました" }); } setGBusy(false); };
  const connect = gWrap(() => onGdConnect(cidInput.trim()), "接続しました。");
  const push = gWrap(() => onGdPush(), "Driveに保存しました。");
  const pull = gWrap(() => onGdPull(), "Driveから取り込みました。");

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal small" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><h2><SyncIcon />データの共用・引き継ぎ</h2><button className="modal-close" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div className="data-tabs">
            <button className={"data-tab" + (tab === "drive" ? " on" : "")} onClick={() => setTab("drive")}>Google Drive</button>
            <button className={"data-tab" + (tab === "export" ? " on" : "")} onClick={() => setTab("export")}>書き出す</button>
            <button className={"data-tab" + (tab === "import" ? " on" : "")} onClick={() => setTab("import")}>読み込む</button>
          </div>

          {tab === "drive" ? (
            <div className="data-pane">
              {!gdConnected ? (
                <React.Fragment>
                  <p className="ai-note">Google Drive 上の1つのファイルにメモを保存し、PC・スマホ両方から読み書きして共用できます。利用には、ホスティングした上で <b>自分のGoogle OAuth クライアントID</b> が必要です。</p>
                  <details className="gd-steps"><summary>かんたん準備手順</summary>
                    <ol>
                      <li>Google Cloud Console でプロジェクトを作成</li>
                      <li>「APIとサービス」→「OAuth同意画面」を設定（テストで自分を追加でOK）</li>
                      <li>「認証情報」→「OAuth クライアントID」→ 種類「ウェブアプリケーション」を作成</li>
                      <li>「承認済みのJavaScript生成元」に、このページを公開しているURL（例: https://ユーザー名.github.io）を追加</li>
                      <li>発行された<b>クライアントID</b>を下に貼り付け</li>
                    </ol>
                  </details>
                  <input className="link-input" placeholder="xxxxxxxx.apps.googleusercontent.com" value={cidInput} onChange={(e) => setCidInput(e.target.value)} />
                  {gMsg && <p className={"data-msg" + (gMsg.ok ? " ok" : " err")}>{gMsg.text}</p>}
                  <div className="data-actions"><button className="btn solid" disabled={!cidInput.trim() || gBusy} onClick={connect}>{gBusy ? "接続中…" : "Googleで接続する"}</button></div>
                  <p className="ai-foot">クライアントIDはこのブラウザ内に保存されます。</p>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <div className="gd-status"><span className="gd-dot" />連携済み{gdSync ? ` ・ 最終同期 ${new Date(gdSync).toLocaleString()}` : ""}</div>
                  <div className="data-actions">
                    <button className="btn solid" disabled={gBusy} onClick={push}>{gBusy ? "処理中…" : "Driveへ保存（アップロード）"}</button>
                    <button className="btn ghost" disabled={gBusy} onClick={pull}>{gBusy ? "処理中…" : "Driveから取得（ダウンロード）"}</button>
                  </div>
                  {gMsg && <p className={"data-msg" + (gMsg.ok ? " ok" : " err")}>{gMsg.text}</p>}
                  <label className="check-toggle gd-auto"><input type="checkbox" checked={gdAuto} onChange={(e) => onGdSetAuto(e.target.checked)} />自動で同期する（開いたとき取得・変更時に保存）</label>
                  <p className="ai-foot">別の端末では同じGoogleアカウントで接続すると同じデータになります。同時に両方で編集した場合は<b>最後の保存が優先</b>されます。<button className="linklike" onClick={onGdDisconnect}>連携を解除</button></p>
                </React.Fragment>
              )}
            </div>
          ) : tab === "export" ? (
            <div className="data-pane">
              <p className="ai-note">この端末のメモ（{count}件{attCount ? ` / 添付 ${attCount}件` : ""}）・フォルダ・画像ファイルをまとめて書き出します。スマホなら「共有」からGoogle Driveを選んで保存できます。</p>
              <div className="data-actions">
                {shareable && <button className="btn solid" disabled={!exportJson} onClick={shareFile}>共有して保存（Driveなど）</button>}
                <button className={"btn " + (shareable ? "ghost" : "solid")} disabled={!exportJson} onClick={download}>{exportJson ? "ファイルで保存（.json）" : "準備中…"}</button>
                <button className="btn ghost" disabled={!exportJson} onClick={copy}>{copied ? "コピーしました" : "テキストをコピー"}</button>
              </div>
              <textarea id="exp-json" className="data-json" readOnly value={exportJson || "書き出しデータを準備しています…"} onFocus={(e) => e.target.select()} />
              <p className="ai-foot">スマホ: 「共有」→ Drive を選択。PC: Drive(パソコン版)を入れていれば保存ダイアログでDriveフォルダを選べます。{attCount ? "画像を含むと容量が大きくなります。" : ""}</p>
            </div>
          ) : (
            <div className="data-pane">
              <p className="ai-note">バックアップを読み込みます。<b>この端末の今のメモは置き換わります</b>のでご注意ください。</p>
              <label className="data-file">ファイルを選ぶ（Driveからも選べます）<input type="file" accept="application/json,.json" onChange={onFile} /></label>
              <textarea className="data-json" placeholder="または、コピーしたテキストをここに貼り付け" value={paste} onChange={(e) => { setPaste(e.target.value); setMsg(null); }} />
              {msg && <p className={"data-msg" + (msg.ok ? " ok" : " err")}>{msg.text}</p>}
              <div className="data-actions">
                <button className="btn solid" disabled={!paste.trim() || busy} onClick={doImport}>{busy ? "読み込み中…" : "読み込む"}</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ------------------------------- app ------------------------------ */

function App() {
  const [memos, setMemos] = useState([]);
  const [folders, setFolders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loaded, setLoaded] = useState(false);
  const [freshId, setFreshId] = useState(null);

  // capture
  const [nt, setNt] = useState("");
  const [showDetail, setShowDetail] = useState(false);
  const [ncat, setNcat] = useState("メモ");
  const [ntags, setNtags] = useState([]);
  const [nlinks, setNlinks] = useState([]);
  const [ndate, setNdate] = useState(null);
  const [ntime, setNtime] = useState(null);
  const [nremind, setNremind] = useState(null);
  const [nattach, setNattach] = useState([]);

  // controls / nav
  const [q, setQ] = useState("");
  const [activeFolder, setActiveFolder] = useState(null);
  const [includeSub, setIncludeSub] = useState(false);
  const [catFilter, setCatFilter] = useState("all");
  const [tagFilter, setTagFilter] = useState(null);
  const [sort, setSort] = useState("created");
  const [hideDone, setHideDone] = useState(false);

  // ui
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [expanded, setExpanded] = useState(new Set());
  const [actionsId, setActionsId] = useState(null);
  const [aiOpen, setAiOpen] = useState(false);
  const [dataOpen, setDataOpen] = useState(false);
  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(API_KEY_KEY) || ""; } catch (e) { return ""; } });
  const [gdCid, setGdCid] = useState(() => { try { return localStorage.getItem("kininari:gd:cid") || SHARED_GD_CID; } catch (e) { return SHARED_GD_CID; } });
  const [gdFileId, setGdFileId] = useState(() => { try { return localStorage.getItem("kininari:gd:file") || ""; } catch (e) { return ""; } });
  const [gdSync, setGdSync] = useState(() => { try { return localStorage.getItem("kininari:gd:sync") || ""; } catch (e) { return ""; } });
  const [gdAuto, setGdAuto] = useState(() => { try { return localStorage.getItem("kininari:gd:auto") === "1"; } catch (e) { return false; } });
  const skipPush = useRef(false);
  const pushTimer = useRef(null);
  const [notifyOn, setNotifyOn] = useState(() => { try { return localStorage.getItem("kininari:notify") === "1"; } catch (e) { return false; } });
  const [toast, setToast] = useState(null);
  const notifiedRef = useRef(new Set());
  const notifyInited = useRef(false);
  const inputRef = useRef(null);

  useEffect(() => {
    let parsed = null;
    try {
      const v = localStorage.getItem(STORAGE_KEY);
      if (v) parsed = JSON.parse(v);
      if (!parsed) { const o = localStorage.getItem(OLD_KEY); if (o) parsed = { memos: JSON.parse(o), notebooks: [] }; }
    } catch (e) {}
    if (!parsed) parsed = seedData();
    const m = (parsed.memos || []).map(normalizeMemo);
    const f = (parsed.notebooks || []).map(normalizeFolder);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ memos: m, notebooks: f })); } catch (e) {}
    setMemos(m); setFolders(f); setLoading(false);
    requestAnimationFrame(() => setLoaded(true));
    skipPush.current = true;
    gcAttachments(m);
  }, []);

  const persist = (nextMemos, nextFolders) => {
    setMemos(nextMemos); setFolders(nextFolders);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ memos: nextMemos, notebooks: nextFolders })); } catch (e) {}
  };
  const saveMemos = (next) => persist(next, folders);
  const saveKey = (k) => { setApiKey(k); try { localStorage.setItem(API_KEY_KEY, k); } catch (e) {} };
  const importData = ({ memos: im, notebooks: inb }) => {
    const m = im.map(normalizeMemo);
    persist(m, (inb || []).map(normalizeFolder));
    setActiveFolder(null); setIncludeSub(false); setExpanded(new Set()); setTagFilter(null); setCatFilter("all"); setQ("");
    gcAttachments(m);
  };

  // Google Drive sync
  const gdSetFile = (id) => { setGdFileId(id); try { localStorage.setItem("kininari:gd:file", id); } catch (e) {} };
  const gdSetSyncTime = (t) => { setGdSync(t); try { localStorage.setItem("kininari:gd:sync", t); } catch (e) {} };
  const gdSetAuto = (v) => { setGdAuto(v); try { localStorage.setItem("kininari:gd:auto", v ? "1" : "0"); } catch (e) {} };
  const gdConnect = async (cid) => {
    const id = (cid || gdCid).trim(); if (!id) throw new Error("クライアントIDを入力してください");
    await gdGetToken(id, true);
    setGdCid(id); try { localStorage.setItem("kininari:gd:cid", id); } catch (e) {}
  };
  const gdDisconnect = () => {
    setGdCid(""); setGdFileId(""); setGdSync(""); setGdAuto(false);
    try { ["kininari:gd:cid", "kininari:gd:file", "kininari:gd:sync"].forEach((k) => localStorage.removeItem(k)); localStorage.setItem("kininari:gd:auto", "0"); } catch (e) {}
  };
  const gdPush = async () => {
    const token = await gdGetToken(gdCid, false);
    const content = JSON.stringify(await buildBackupObject(memos, folders));
    let id = gdFileId || ((await gdFindFile(token)) || {}).id;
    let meta; if (id) meta = await gdUpdate(token, id, content); else { meta = await gdCreate(token, content); id = meta.id; }
    gdSetFile(id); gdSetSyncTime(meta.modifiedTime || new Date().toISOString());
  };
  const gdPull = async () => {
    const token = await gdGetToken(gdCid, false);
    let id = gdFileId || ((await gdFindFile(token)) || {}).id;
    if (!id) throw new Error("Driveにデータが見つかりません。先に「アップロード」してください。");
    const obj = JSON.parse(await gdDownload(token, id));
    if (!Array.isArray(obj.memos)) throw new Error("データ形式が不正です");
    await restoreBackupFiles(obj.files);
    skipPush.current = true;
    importData({ memos: obj.memos, notebooks: obj.notebooks });
    gdSetFile(id);
    const meta = await gdGetMeta(token, id);
    gdSetSyncTime(meta.modifiedTime || new Date().toISOString());
  };

  // auto: pull newer on open
  useEffect(() => {
    if (loading || !gdAuto || !gdCid) return;
    let alive = true;
    (async () => {
      try {
        const token = await gdGetToken(gdCid, false);
        const id = gdFileId || ((await gdFindFile(token)) || {}).id;
        if (!id || !alive) return;
        const meta = await gdGetMeta(token, id);
        if (alive && meta.modifiedTime && (!gdSync || meta.modifiedTime > gdSync)) {
          const obj = JSON.parse(await gdDownload(token, id));
          if (Array.isArray(obj.memos)) { await restoreBackupFiles(obj.files); skipPush.current = true; importData({ memos: obj.memos, notebooks: obj.notebooks }); gdSetFile(id); gdSetSyncTime(meta.modifiedTime); }
        }
      } catch (e) {}
    })();
    return () => { alive = false; };
  }, [loading]);

  // auto: push on change (debounced)
  useEffect(() => {
    if (loading || !gdAuto || !gdCid) return;
    if (skipPush.current) { skipPush.current = false; return; }
    if (pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => { gdPush().catch(() => {}); }, 3000);
    return () => { if (pushTimer.current) clearTimeout(pushTimer.current); };
  }, [memos, folders]);

  // notifications / reminders
  const saveNotify = (v) => { try { localStorage.setItem("kininari:notify", v ? "1" : "0"); } catch (e) {} };
  const triggersSupported = typeof navigator !== "undefined" && "serviceWorker" in navigator && typeof window !== "undefined" && "Notification" in window && "TimestampTrigger" in window;
  const swActive = () => triggersSupported && typeof Notification !== "undefined" && Notification.permission === "granted";

  const scheduleTriggers = async () => {
    if (!swActive()) return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const existing = await reg.getNotifications({ includeTriggered: true });
      existing.forEach((n) => { if (n.tag && n.tag.indexOf("kininari-") === 0) n.close(); });
      const now = Date.now();
      for (const m of memos) {
        if (m.done) continue;
        const tt = memoTriggerTime(m);
        if (tt == null || tt <= now) continue;
        try {
          await reg.showNotification("⏰ " + (m.title || "タスク"), {
            body: [m.category, m.date ? fmtDate(m.date, m.time) : ""].filter(Boolean).join(" · "),
            tag: "kininari-" + m.id, showTrigger: new TimestampTrigger(tt), data: { url: location.href },
          });
        } catch (e) {}
      }
    } catch (e) {}
  };
  const cancelTriggers = async () => {
    if (!triggersSupported) return;
    try { const reg = await navigator.serviceWorker.ready; const ns = await reg.getNotifications({ includeTriggered: true }); ns.forEach((n) => { if (n.tag && n.tag.indexOf("kininari-") === 0) n.close(); }); } catch (e) {}
  };

  const toggleNotify = async () => {
    const v = !notifyOn; setNotifyOn(v); saveNotify(v);
    if (!v) { cancelTriggers(); return; }
    if (typeof Notification === "undefined") { setToast({ title: "通知に未対応", body: "このブラウザは通知に対応していません。" }); return; }
    let perm = Notification.permission;
    if (perm === "default") { try { perm = await Notification.requestPermission(); } catch (e) {} }
    if (perm === "granted") {
      if (triggersSupported) { scheduleTriggers(); setToast({ title: "通知ON", body: "アプリを閉じていても通知できます（対応ブラウザ）。" }); }
      else setToast({ title: "通知ON", body: "アプリ起動中にお知らせします。" });
    } else if (perm === "denied") setToast({ title: "OS通知はブロック中", body: "起動中はアプリ内バナーでお知らせします。設定で許可するとOS通知になります。" });
  };

  const fireReminder = (m) => {
    const body = [m.category, m.date ? fmtDate(m.date, m.time) : ""].filter(Boolean).join(" · ");
    let shown = false;
    try { if (typeof Notification !== "undefined" && Notification.permission === "granted") { const n = new Notification("⏰ " + (m.title || "タスク"), { body, tag: "kininari-" + m.id }); n.onclick = () => { try { window.focus(); } catch (e) {} n.close(); }; shown = true; } } catch (e) {}
    if (!shown) { setToast({ title: "⏰ " + (m.title || "タスク"), body }); }
  };

  // register the service worker once (needed for background notifications)
  useEffect(() => { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {}); }, []);

  // background: keep scheduled triggers in sync with reminders
  useEffect(() => {
    if (loading || !triggersSupported) return;
    if (notifyOn && typeof Notification !== "undefined" && Notification.permission === "granted") scheduleTriggers();
    else cancelTriggers();
  }, [memos, notifyOn, loading]);

  // foreground fallback (only when SW triggers aren't handling it)
  useEffect(() => {
    if (loading || swActive()) return;
    const scan = () => {
      const now = Date.now();
      memos.forEach((m) => {
        if (m.done) return;
        const tt = memoTriggerTime(m);
        if (tt == null || tt > now) return;
        const key = m.id + "@" + tt;
        if (notifiedRef.current.has(key)) return;
        notifiedRef.current.add(key);
        if (notifyInited.current && notifyOn) fireReminder(m);
      });
      notifyInited.current = true;
    };
    scan();
    const iv = setInterval(scan, 30000);
    return () => clearInterval(iv);
  }, [memos, notifyOn, loading]);

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 9000); return () => clearTimeout(t); }, [toast]);

  // tree helpers
  const childrenOf = (pid) => folders.filter((f) => (f.parentId || null) === (pid ?? null)).sort((a, b) => a.createdAt - b.createdAt);
  const descendantsOf = (id) => { const out = []; const stack = [id]; while (stack.length) { const cur = stack.pop(); folders.forEach((f) => { if ((f.parentId || null) === cur) { out.push(f.id); stack.push(f.id); } }); } return out; };
  const pathOf = (id) => { const path = []; let cur = folders.find((f) => f.id === id); while (cur) { path.unshift(cur); cur = cur.parentId ? folders.find((f) => f.id === cur.parentId) : null; } return path; };
  const flatFolders = useMemo(() => {
    const acc = [];
    const walk = (pid, depth) => { folders.filter((f) => (f.parentId || null) === pid).sort((a, b) => a.createdAt - b.createdAt).forEach((f) => { acc.push({ folder: f, depth }); walk(f.id, depth + 1); }); };
    walk(null, 0); return acc;
  }, [folders]);

  // memo actions
  const add = () => {
    const title = nt.trim(); if (!title) return;
    const auto = findUrl(title);
    const links = auto && !nlinks.includes(auto) ? [...nlinks, auto] : nlinks;
    const m = { id: uid(), title, body: "", category: ncat, tags: ntags, links, notebookId: activeFolder, date: ndate, time: ndate ? ntime : null, remind: ndate ? nremind : null, attachments: nattach, done: false, pinned: false, createdAt: Date.now() };
    persist([m, ...memos], folders);
    setFreshId(m.id); setTimeout(() => setFreshId((f) => (f === m.id ? null : f)), 1400);
    setNt(""); setNtags([]); setNlinks([]); setNdate(null); setNtime(null); setNremind(null); setNcat("メモ"); setNattach([]); setShowDetail(false);
    inputRef.current && inputRef.current.focus();
  };
  const save = (id, patch) => saveMemos(memos.map((m) => (m.id === id ? { ...m, ...patch } : m)));
  const toggleDone = (id) => saveMemos(memos.map((m) => (m.id === id ? { ...m, done: !m.done } : m)));
  const pin = (id) => saveMemos(memos.map((m) => (m.id === id ? { ...m, pinned: !m.pinned } : m)));
  const del = (id) => saveMemos(memos.filter((m) => m.id !== id));
  const applyTag = (id, tag) => saveMemos(memos.map((m) => (m.id === id ? { ...m, tags: [...new Set([...(m.tags || []), tag])] } : m)));
  const applyAllTags = (map) => saveMemos(memos.map((m) => (map[m.id] ? { ...m, tags: [...new Set([...(m.tags || []), ...map[m.id]])] } : m)));

  // folder actions
  const createFolder = (name, parentId) => {
    const f = { id: uid(), name: (name || "新しいフォルダ").trim() || "新しいフォルダ", color: NB_COLORS[folders.length % NB_COLORS.length], parentId: parentId ?? null, pinned: false, createdAt: Date.now() };
    persist(memos, [...folders, f]); return f;
  };
  const addRoot = (name) => { const f = createFolder(name, null); setActiveFolder(f.id); setDrawerOpen(false); };
  const addSub = (parentId, name) => { createFolder(name, parentId); setExpanded((s) => new Set(s).add(parentId)); };
  const renameFolder = (id, name) => persist(memos, folders.map((f) => (f.id === id ? { ...f, name } : f)));
  const togglePinFolder = (id) => persist(memos, folders.map((f) => (f.id === id ? { ...f, pinned: !f.pinned } : f)));
  const moveFolder = (id, target) => {
    if (target === id) return;
    if (target != null && descendantsOf(id).includes(target)) return;
    persist(memos, folders.map((f) => (f.id === id ? { ...f, parentId: target } : f)));
  };
  const createGroup = (name, ids) => {
    const f = { id: uid(), name: name.trim() || "新しいフォルダ", color: NB_COLORS[folders.length % NB_COLORS.length], parentId: null, pinned: false, createdAt: Date.now() };
    persist(memos.map((m) => (ids.includes(m.id) ? { ...m, notebookId: f.id } : m)), [...folders, f]);
  };
  const deleteFolder = (id) => {
    const target = folders.find((f) => f.id === id); if (!target) return;
    const np = target.parentId ?? null;
    const nextFolders = folders.filter((f) => f.id !== id).map((f) => (f.parentId === id ? { ...f, parentId: np } : f));
    const nextMemos = memos.map((m) => (m.notebookId === id ? { ...m, notebookId: np } : m));
    persist(nextMemos, nextFolders);
    if (activeFolder === id) setActiveFolder(np);
  };

  const toggleExpand = (id) => setExpanded((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });

  // derived
  const allTags = useMemo(() => { const c = {}; memos.forEach((m) => (m.tags || []).forEach((t) => (c[t] = (c[t] || 0) + 1))); return Object.keys(c).sort((a, b) => c[b] - c[a]); }, [memos]);
  const subtreeMemos = useMemo(() => { if (activeFolder == null) return memos; const ids = new Set([activeFolder, ...descendantsOf(activeFolder)]); return memos.filter((m) => ids.has(m.notebookId)); }, [memos, folders, activeFolder]);

  const searching = q.trim().length > 0;
  const showSubRows = !searching && !includeSub;
  const showFolderChip = searching || includeSub;

  const baseMemos = useMemo(() => {
    if (searching) return memos;
    if (includeSub) return activeFolder == null ? memos : subtreeMemos;
    return memos.filter((m) => (m.notebookId || null) === activeFolder);
  }, [memos, subtreeMemos, activeFolder, includeSub, searching]);

  const visible = useMemo(() => {
    let list = baseMemos.filter((m) => {
      if (catFilter !== "all" && m.category !== catFilter) return false;
      if (tagFilter && !(m.tags || []).includes(tagFilter)) return false;
      if (hideDone && m.done) return false;
      if (searching) { const s = (m.title + " " + (m.body || "") + " " + (m.tags || []).join(" ")).toLowerCase(); if (!s.includes(q.trim().toLowerCase())) return false; }
      return true;
    });
    const dval = (m) => (m.date ? Number(m.date.replace(/-/g, "") + (m.time ? m.time.replace(":", "") : "0000")) : Infinity);
    list.sort((a, b) => { if (a.pinned !== b.pinned) return a.pinned ? -1 : 1; if (sort === "date" && dval(a) !== dval(b)) return dval(a) - dval(b); return b.createdAt - a.createdAt; });
    return list;
  }, [baseMemos, catFilter, tagFilter, hideDone, q, sort, searching]);

  const subFolders = showSubRows ? childrenOf(activeFolder) : [];
  const remaining = memos.filter((m) => !m.done).length;
  const crumbs = pathOf(activeFolder);
  const actionsFolder = folders.find((f) => f.id === actionsId);
  const backupData = useMemo(() => ({ memos, notebooks: folders }), [memos, folders]);
  const hasSubsHere = childrenOf(activeFolder).length > 0;

  return (
    <div className="wrap">
      <style>{CSS}</style>

      <div className="shell">
       <aside className="sidebar">
         <div className="sidebar-head"><FolderIcon />フォルダ</div>
         <div className="sidebar-body">
           <FolderTreeContent folders={folders} memos={memos} expanded={expanded} onToggle={toggleExpand} active={activeFolder}
             onSelect={(id) => { setActiveFolder(id); setIncludeSub(false); }} onActions={(id) => setActionsId(id)} onAddRoot={addRoot} />
         </div>
       </aside>

       <div className={"main" + (loaded ? " in" : "")}>
        <header className="head">
          <div className="brand"><span className="seal">気</span><div><h1>気になり帳</h1><p>気になったこと、ぜんぶここに。</p></div></div>
          <div className="head-right">
            <div className="counter"><b>{memos.length}</b>件 · のこり<b>{remaining}</b></div>
            <button className={"data-btn bell" + (notifyOn ? " on" : "")} onClick={toggleNotify} aria-label="タスク通知"><BellIcon on={notifyOn} /></button>
            <button className="data-btn" onClick={() => setDataOpen(true)} aria-label="端末間でデータを引き継ぐ"><SyncIcon /></button>
          </div>
        </header>

        <div className="locbar">
          <button className="folder-btn" onClick={() => setDrawerOpen(true)} aria-label="フォルダを開く"><FolderIcon /></button>
          <div className="crumbs">
            <button className={"crumb" + (activeFolder == null ? " here" : "")} onClick={() => setActiveFolder(null)}>すべて</button>
            {crumbs.map((f, i) => (
              <React.Fragment key={f.id}>
                <span className="sep"><ChevIcon /></span>
                <button className={"crumb" + (i === crumbs.length - 1 ? " here" : "")} style={{ "--c": f.color }} onClick={() => setActiveFolder(f.id)}>{f.name}</button>
              </React.Fragment>
            ))}
          </div>
        </div>

        <section className="capture" {...dropPasteHandlers((added) => setNattach((prev) => [...prev, ...added]))}>
          <div className="capture-row">
            <input ref={inputRef} className="capture-input" value={nt} placeholder={activeFolder == null ? "気になったこと、書いてみよう…" : "このフォルダに書く…"} onChange={(e) => setNt(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") add(); }} />
            <button className="add" onClick={add} aria-label="追加">＋</button>
          </div>
          <div className="capture-meta">
            <button className={"detail-toggle" + (showDetail ? " on" : "")} onClick={() => setShowDetail((s) => !s)}>{showDetail ? "詳細をとじる" : "分類・タグ・リンク・日付"}</button>
            {!showDetail && (ndate || nlinks.length || ntags.length || nattach.length || ncat !== "メモ") ? (
              <span className="meta-preview" style={{ "--c": catColor(ncat) }}><span className="dot" />{ncat}{ntags.length ? ` ·#${ntags[0]}${ntags.length > 1 ? "+" : ""}` : ""}{ndate ? ` · ${fmtDate(ndate, ntime)}` : ""}{nlinks.length ? ` · 🔗${nlinks.length}` : ""}{nattach.length ? ` · 📎${nattach.length}` : ""}</span>
            ) : null}
          </div>
          {showDetail && (
            <div className="capture-detail">
              <div className="mini-label">分類</div><CategoryPicker value={ncat} onChange={setNcat} />
              <div className="mini-label">タグ</div><TagEditor tags={ntags} onChange={setNtags} suggestions={allTags} />
              <div className="mini-label">リンク（複数OK）</div><LinksEditor links={nlinks} onChange={setNlinks} />
              <div className="mini-label">日付</div><DateFields date={ndate} time={ntime} onDate={setNdate} onTime={setNtime} />
              {ndate && <ReminderField value={nremind} onChange={setNremind} />}
              <div className="mini-label">画像・ファイル</div><AttachmentEditor attachments={nattach} onChange={setNattach} />
            </div>
          )}
        </section>

        <section className="controls">
          <div className="controls-top">
            <div className="search">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4-4" /></svg>
              <input value={q} placeholder="すべてのメモを検索" onChange={(e) => setQ(e.target.value)} />
              {q && <button className="x" onClick={() => setQ("")}>×</button>}
            </div>
            <button className="ai-btn" disabled={subtreeMemos.length === 0} onClick={() => setAiOpen(true)}><SparkIcon />AIで整理する{activeFolder != null && crumbs.length ? `（${crumbs[crumbs.length - 1].name}）` : ""}</button>
          </div>
          <div className="filters">
            <button className={"f" + (catFilter === "all" ? " on" : "")} onClick={() => setCatFilter("all")}>すべて</button>
            {CATEGORIES.map((c) => (<button key={c.key} className={"f" + (catFilter === c.key ? " on" : "")} style={{ "--c": c.color }} onClick={() => setCatFilter((p) => (p === c.key ? "all" : c.key))}><span className="dot" />{c.key}</button>))}
          </div>
          {allTags.length > 0 && (
            <div className="filters tags-row">
              {tagFilter && <button className="f tag on" onClick={() => setTagFilter(null)}>#{tagFilter} ×</button>}
              {allTags.filter((t) => t !== tagFilter).slice(0, 12).map((t) => (<button key={t} className="f tag" onClick={() => setTagFilter(t)}>#{t}</button>))}
            </div>
          )}
          <div className="sub-controls">
            <div className="sub-left">
              <label className="check-toggle"><input type="checkbox" checked={hideDone} onChange={(e) => setHideDone(e.target.checked)} />完了を隠す</label>
              {hasSubsHere && !searching && <label className="check-toggle"><input type="checkbox" checked={includeSub} onChange={(e) => setIncludeSub(e.target.checked)} />サブフォルダも</label>}
            </div>
            <select value={sort} onChange={(e) => setSort(e.target.value)}><option value="created">新しい順</option><option value="date">日付が近い順</option></select>
          </div>
        </section>

        {subFolders.length > 0 && (
          <section className="folders-list">
            {subFolders.map((f) => (
              <FolderRow key={f.id} folder={f} memoCount={memos.filter((m) => m.notebookId === f.id).length} subCount={childrenOf(f.id).length} onOpen={() => setActiveFolder(f.id)} onActions={() => setActionsId(f.id)} />
            ))}
          </section>
        )}

        <section className="list">
          {loading ? <div className="empty"><p>よみこみ中…</p></div>
            : visible.length === 0 ? (
              <div className="empty">
                <div className="empty-mark">∅</div>
                <p>{memos.length === 0 ? "まだ何もありません。\n上の欄に気になったことを書いてみましょう。" : (subFolders.length > 0 ? "このフォルダの直下にメモはありません。" : "条件に合うメモはありません。")}</p>
              </div>
            ) : visible.map((m) => (
              <MemoCard key={m.id} memo={m} folders={folders} flatFolders={flatFolders} allTags={allTags} showFolder={showFolderChip} fresh={m.id === freshId} onToggleDone={toggleDone} onPin={pin} onDelete={del} onSave={save} onTagClick={setTagFilter} />
            ))}
        </section>

        <footer className="foot">メモはこのブラウザ内に保存され、次に開いたときも残ります。</footer>
       </div>
      </div>

      {drawerOpen && (
        <FolderDrawer folders={folders} memos={memos} expanded={expanded} onToggle={toggleExpand} active={activeFolder}
          onSelect={(id) => { setActiveFolder(id); setIncludeSub(false); setDrawerOpen(false); }} onActions={(id) => setActionsId(id)} onAddRoot={addRoot} onClose={() => setDrawerOpen(false)} />
      )}
      {actionsFolder && (
        <FolderActionsModal folder={actionsFolder} parentName={actionsFolder.parentId ? (folders.find((f) => f.id === actionsFolder.parentId)?.name || "上の階層") : "すべて（ルート）"}
          flat={flatFolders} descendants={descendantsOf(actionsFolder.id)} onClose={() => setActionsId(null)}
          onAddSub={addSub} onRename={renameFolder} onMove={moveFolder} onTogglePin={togglePinFolder} onDelete={deleteFolder} />
      )}
      {aiOpen && <AIPanel memos={subtreeMemos} folders={folders} apiKey={apiKey} onSaveKey={saveKey} onClose={() => setAiOpen(false)} onApplyTag={applyTag} onApplyAllTags={applyAllTags} onCreateGroup={createGroup} />}
      {dataOpen && <DataModal data={backupData} onImport={importData} onClose={() => setDataOpen(false)}
        gdCid={gdCid} gdSync={gdSync} gdAuto={gdAuto} gdConnected={!!gdCid}
        onGdConnect={gdConnect} onGdPush={gdPush} onGdPull={gdPull} onGdSetAuto={gdSetAuto} onGdDisconnect={gdDisconnect} />}

      {toast && (
        <div className="toast" onClick={() => setToast(null)}>
          <span className="toast-ic"><BellIcon on={true} /></span>
          <div className="toast-txt"><div className="toast-title">{toast.title}</div>{toast.body && <div className="toast-body">{toast.body}</div>}</div>
          <button className="toast-x" onClick={(e) => { e.stopPropagation(); setToast(null); }}>×</button>
        </div>
      )}
    </div>
  );
}

<script>
(function(){
  function unesc(s){ return s.replace(/<\\\/script/gi, '<\/script'); }
  var loaded = {};
  function load(app){
    if(loaded[app]) return;
    var el = document.getElementById('src-'+app);
    var fr = document.getElementById('frame-'+app);
    if(!el || !fr) return;
    fr.srcdoc = unesc(el.textContent);
    loaded[app] = true;
  }
  function show(app){
    var tabs = document.querySelectorAll('.apptab');
    for(var i=0;i<tabs.length;i++){ tabs[i].classList.toggle('active', tabs[i].getAttribute('data-app')===app); }
    var fr = document.querySelectorAll('.appframe');
    for(var j=0;j<fr.length;j++){ fr[j].classList.toggle('active', fr[j].id===('frame-'+app)); }
    load(app);
  }
  var tabs = document.querySelectorAll('.apptab');
  for(var k=0;k<tabs.length;k++){
    tabs[k].addEventListener('click', (function(t){ return function(){ show(t.getAttribute('data-app')); }; })(tabs[k]));
  }
  window.addEventListener('message', function(e){ if(e.data && e.data.knTab){ show(e.data.knTab); } });

  // ---- combined backup (shell reads same-origin storage of both apps) ----
  function knOpenDB(){ return new Promise(function(res,rej){ var r=indexedDB.open('kininari',1); r.onupgradeneeded=function(){ try{ if(!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files',{keyPath:'id'}); }catch(e){} }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
  function knIdbAll(db){ return new Promise(function(res){ try{ var tx=db.transaction('files','readonly'); var rq=tx.objectStore('files').getAll(); rq.onsuccess=function(){ res(rq.result||[]); }; rq.onerror=function(){ res([]); }; }catch(e){ res([]); } }); }
  function knIdbPut(db,rec){ return new Promise(function(res){ try{ var tx=db.transaction('files','readwrite'); tx.objectStore('files').put(rec); tx.oncomplete=function(){res(true);}; tx.onerror=function(){res(false);}; }catch(e){ res(false);} }); }
  function blobToDataURL(b){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=function(){rej(fr.error);}; fr.readAsDataURL(b); }); }
  function knMsg(t,ok){ var el=document.getElementById('knMsg'); if(!el) return; el.textContent=t||''; el.className='knmodal-msg'+(ok===true?' ok':(ok===false?' err':'')); }
  function knModalOpen(v){ document.getElementById('knModal').classList.toggle('open', !!v); if(v) knMsg(''); }

  async function knBuildBackup(){
    var diary = localStorage.getItem('diaryEntries');
    var diaryLast = localStorage.getItem('diaryLastBackup');
    var kdata = localStorage.getItem('kininari:data:v2');
    var files=[];
    try{ var db=await knOpenDB(); var recs=await knIdbAll(db); for(var i=0;i<recs.length;i++){ var r=recs[i]; if(r&&r.blob){ try{ files.push({id:r.id,name:r.name,type:r.type,dataUrl:await blobToDataURL(r.blob)}); }catch(e){} } } }catch(e){}
    return { app:'nikki-kininari', v:1, exportedAt:new Date().toISOString(), diary:diary, diaryLastBackup:diaryLast, kininari:{ data:kdata, files:files } };
  }
  async function knExport(){
    knMsg('準備中…');
    try{
      var obj=await knBuildBackup();
      var blob=new Blob([JSON.stringify(obj)],{type:'application/json'});
      var url=URL.createObjectURL(blob); var a=document.createElement('a');
      a.href=url; a.download='nikki-kininari-backup-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url);},1000);
      knMsg('書き出しました。', true);
    }catch(e){ knMsg('書き出しに失敗しました。', false); }
  }
  async function knDoImport(file){
    knMsg('取り込み中…');
    try{
      var text=await file.text(); var obj=JSON.parse(text);
      if(typeof obj.diary==='string') localStorage.setItem('diaryEntries', obj.diary);
      if(obj.diaryLastBackup) localStorage.setItem('diaryLastBackup', obj.diaryLastBackup);
      if(obj.kininari){
        if(typeof obj.kininari.data==='string') localStorage.setItem('kininari:data:v2', obj.kininari.data);
        var files=(obj.kininari.files||[]);
        if(files.length){ var db=await knOpenDB(); for(var i=0;i<files.length;i++){ var f=files[i]; try{ var bl=await (await fetch(f.dataUrl)).blob(); await knIdbPut(db,{id:f.id,blob:bl,name:f.name,type:f.type,size:bl.size}); }catch(e){} } }
      }
      knMsg('取り込みました。再読み込みします…', true);
      setTimeout(function(){ location.reload(); }, 900);
    }catch(e){ knMsg('取り込めませんでした。ファイルを確認してください。', false); }
  }

  document.getElementById('knBackupBtn').addEventListener('click', function(){ knModalOpen(true); });
  document.getElementById('knModalX').addEventListener('click', function(){ knModalOpen(false); });
  document.getElementById('knModal').addEventListener('click', function(e){ if(e.target.id==='knModal') knModalOpen(false); });
  document.getElementById('knExport').addEventListener('click', knExport);
  document.getElementById('knImport').addEventListener('change', function(e){ var f=e.target.files&&e.target.files[0]; if(f) knDoImport(f); e.target.value=''; });

  show('diary');
})();
</script>
</body>
</html>
