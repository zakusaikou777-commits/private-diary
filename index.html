<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>日記帳 & 気になり帳</title>
<meta name="theme-color" content="#f4ecda" />
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#f4ecda;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
#tabbar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;gap:6px;align-items:center;justify-content:center;padding:7px 10px;background:#f4ecda;border-bottom:1px solid #e2d6bd;z-index:10}
.apptab{flex:1;max-width:220px;border:1px solid #e2d6bd;background:#fff;color:#7a6f5e;font-size:14px;font-weight:700;padding:9px 12px;border-radius:10px;cursor:pointer;font-family:inherit;transition:all .15s}
.apptab.active{background:#c0463c;color:#fdf1e6;border-color:#c0463c;box-shadow:0 3px 10px rgba(160,57,47,.25)}
.iconbtn{flex:none;height:36px;width:40px;border:1px solid #e2d6bd;background:#fff;color:#7a6f5e;border-radius:9px;cursor:pointer;font-size:16px}
.iconbtn:hover{border-color:#c0463c}
#frames{position:fixed;top:48px;left:0;right:0;bottom:0;background:#f4ecda}
.appframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
.appframe.active{display:block}
.knmodal{position:fixed;inset:0;background:rgba(40,32,24,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.knmodal.open{display:flex}
.knmodal-card{background:#fdf8ec;border:1px solid #e2d6bd;border-radius:16px;max-width:440px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.knmodal-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:17px;color:#2c2620;font-family:"Shippori Mincho",serif}
.knmodal-x{border:none;background:none;font-size:22px;color:#7a6f5e;cursor:pointer;line-height:1}
.knmodal-note{font-size:12.5px;color:#7a6f5e;line-height:1.7;margin:10px 0 14px}
.knmodal-row{display:flex;flex-direction:column;gap:9px}
.knbtn{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid #e2d6bd}
.knbtn.solid{background:#c0463c;color:#fdf1e6;border-color:#c0463c}
.knbtn.ghost{background:#fff;color:#2c2620}
.knmodal-msg{font-size:12.5px;margin:12px 2px 0;min-height:1em}
.knmodal-msg.ok{color:#57845A}
.knmodal-msg.err{color:#b3402f}
</style>
</head>
<body>
<div id="tabbar">
<button class="apptab active" type="button" data-app="diary">📔 日記</button>
<button class="apptab" type="button" data-app="kininari">📝 気になり帳</button>
<button id="knBackupBtn" class="iconbtn" type="button" title="まとめてバックアップ">💾</button>
</div>
<div id="frames">
<iframe id="frame-diary" class="appframe active" title="日記帳" allow="clipboard-read; clipboard-write"></iframe>
<iframe id="frame-kininari" class="appframe" title="気になり帳" allow="clipboard-read; clipboard-write"></iframe>
</div>
<div id="knModal" class="knmodal">
<div class="knmodal-card">
<div class="knmodal-h">💾 まとめてバックアップ<button id="knModalX" class="knmodal-x" type="button">×</button></div>
<p class="knmodal-note">日記帳と気になり帳の両方のデータ（添付の画像・ファイルも含む）を1つのファイルに書き出し／取り込みします。取り込むと現在のデータは置き換わり、自動で再読み込みします。</p>
<div class="knmodal-row">
<button id="knExport" class="knbtn solid" type="button">まとめて書き出す（.json）</button>
<label class="knbtn ghost">取り込む（ファイルを選択）<input id="knImport" type="file" accept="application/json,.json" hidden></label>
</div>
<p id="knMsg" class="knmodal-msg"></p>
</div>
</div>

    <script>
        const DB_NAME = 'DiaryDB';
        const STORE_NAME = 'handles';
        const dbPromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });

        async function saveHandle(key, handle) {
            const db = await dbPromise;
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put(handle, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getHandle(key) {
            const db = await dbPromise;
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        let entries = [];
        let currentEntry = null;
        let currentFilters = { tags: [], searchText: '' };
        let autoSyncAEnabled = false;
        let syncFolderHandleA = null;
        let currentView = 'calendar';
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let selectedDate = null;

// ---- Phase1: autosave + dirty indicator + navigation guard ----
let isDirty = false;
let autoSaveTimer = null;
let lastSavedAt = null;

// ---- Phase2: at-rest passphrase encryption (PBKDF2 -> AES-GCM-256) ----
let cryptoKey = null;        // CryptoKey when unlocked, otherwise null
let encEnabled = false;      // whether encryption is currently active
let encMeta = null;          // { salt: base64, iter } used to (re)derive the key
let appLocked = false;       // encEnabled && key not yet provided this session
let pendingUnlockBlob = null;// the encrypted blob awaiting passphrase at startup
let backupReminderDismissed = false; // session-only dismiss for the backup reminder
const PBKDF2_ITER = 250000;

const ENC = {
  enc: new TextEncoder(),
  dec: new TextDecoder(),
  b64(buf) {
    const bytes = new Uint8Array(buf);
    let bin = '';
    const CH = 0x8000; // chunk to avoid call-stack overflow on large buffers
    for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(bin);
  },
  unb64(str) {
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },
  async deriveKey(passphrase, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', this.enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  },
  async encryptString(plaintext, key, saltBytes, iterations) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, this.enc.encode(plaintext));
    return { __enc__: 1, v: 1, kdf: 'PBKDF2-SHA256', iter: iterations, salt: this.b64(saltBytes), iv: this.b64(iv), ct: this.b64(ct) };
  },
  async decryptToString(blob, key) {
    const iv = this.unb64(blob.iv);
    const ct = this.unb64(blob.ct);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return this.dec.decode(pt);
  }
};

function isEncBlob(o) { return o && typeof o === 'object' && o.__enc__ === 1 && o.ct && o.iv && o.salt; }

// Try the in-session key first; if that fails (or none), prompt for a passphrase
// and derive a key from the blob's own salt/iter (enables cross-device import).
async function decryptIncomingBlob(blob) {
  if (cryptoKey) {
    try { return await ENC.decryptToString(blob, cryptoKey); } catch (_) {}
  }
  const pass = prompt('このデータは暗号化されています。パスフレーズを入力してください');
  if (!pass) throw new Error('cancelled');
  const key = await ENC.deriveKey(pass, ENC.unb64(blob.salt), blob.iter || PBKDF2_ITER);
  return await ENC.decryptToString(blob, key); // throws on wrong passphrase
}

function updateSaveStatus() {
  const el = document.getElementById('saveStatus');
  if (!el) return;

  if (!currentEntry) { el.textContent = ''; return; }

  if (isDirty) {
    el.textContent = '未保存';
    el.style.color = 'var(--color-warning)';
    return;
  }

  el.textContent = lastSavedAt ? `保存済み (${lastSavedAt})` : '保存済み';
  el.style.color = 'var(--color-text-secondary)';
}

function markDirty() {
  isDirty = true;
  updateSaveStatus();
}

function scheduleAutoSave() {
  if (!currentEntry) return;
  if (autoSaveTimer) clearTimeout(autoSaveTimer);

  autoSaveTimer = setTimeout(() => {
    if (!isDirty) return;
    saveEntry(true); // quiet
  }, 800);
}

async function ensureSavedOrConfirmLoseChanges(actionLabel = '移動') {
  if (!currentEntry) return true;
  if (!isDirty) return true;

  const ok = await saveEntry(true); // quiet
  if (ok) return true;
  return confirm(`未保存の変更を保存できませんでした。このまま${actionLabel}すると変更が失われます。続行しますか？`);
}

window.addEventListener('beforeunload', (e) => {
  if (!isDirty) return;
  e.preventDefault();
  e.returnValue = '';
});


        async function init() {
            const status = await loadEntriesFromStorage();
            autoSyncAEnabled = localStorage.getItem('autoSyncA') === 'true';
            if (document.getElementById('autoSyncA')) {
                document.getElementById('autoSyncA').checked = autoSyncAEnabled;
            }
            await checkSyncHandleA();
            updateEncUI();
            updateStats();
            renderCalendar();
            renderEntriesList();
            renderEditor();
            updateBackupReminder();
            if (status === 'locked') openUnlockModal();
        }

        function looksLikeHtml(s) {
            return /<\/?(b|strong|i|em|u|s|strike|del|br|p|div|span|ul|ol|li|blockquote|a|table|thead|tbody|tfoot|tr|td|th|h[1-6]|pre|code|hr)\b[^>]*>/i.test(s || '');
        }

        // contentFormat を確定するマイグレーション（#6）。変更があれば true。保存は呼び出し側。
        function migrateContentFormat() {
            let migrated = false;
            entries.forEach(e => {
                if (e && typeof e === 'object' && !e.contentFormat) {
                    e.contentFormat = looksLikeHtml(e.content) ? 'html' : 'plain';
                    migrated = true;
                }
            });
            return migrated;
        }

        // 戻り値: 'ok' | 'locked' | 'empty' | 'corrupt'
        async function loadEntriesFromStorage() {
            const stored = localStorage.getItem('diaryEntries');
            if (!stored) { entries = []; return 'empty'; }
            let parsed;
            try {
                parsed = JSON.parse(stored);
            } catch (err) {
                console.error('保存データの読み込みに失敗:', err);
                try { localStorage.setItem('diaryEntries_corrupt_backup', stored); } catch (_) {}
                entries = [];
                setTimeout(() => showToast('保存データを読み込めませんでした。空の状態で起動しました', 'error'), 0);
                return 'corrupt';
            }
            if (isEncBlob(parsed)) {
                // 暗号化済み。パスフレーズ入力まで中身は読めない（#暗号化）
                encEnabled = true;
                appLocked = true;
                pendingUnlockBlob = parsed;
                entries = [];
                return 'locked';
            }
            entries = Array.isArray(parsed) ? parsed : [];
            encEnabled = false;
            if (migrateContentFormat()) { await saveEntriesToStorage(); }
            return 'ok';
        }

        async function saveEntriesToStorage() {
            // ロック中（暗号化済みだが未解除）は保存しない＝暗号文を平文で上書きする事故を防ぐ
            if (encEnabled && !cryptoKey) {
                showToast('ロックを解除してから操作してください', 'error');
                return false;
            }
            let toStore;
            try {
                const plain = JSON.stringify(entries);
                if (encEnabled && cryptoKey && encMeta) {
                    const blob = await ENC.encryptString(plain, cryptoKey, ENC.unb64(encMeta.salt), encMeta.iter);
                    toStore = JSON.stringify(blob);
                } else {
                    toStore = plain;
                }
            } catch (err) {
                console.error('暗号化に失敗:', err);
                showToast('暗号化に失敗したため保存を中止しました', 'error');
                return false;
            }
            try {
                localStorage.setItem('diaryEntries', toStore);
            } catch (err) {
                console.error('保存に失敗:', err);
                const quota = err && (err.name === 'QuotaExceededError' || err.code === 22 || err.code === 1014);
                showToast(quota
                    ? '保存容量の上限に達しました。不要な日記を削除するかエクスポートしてください'
                    : '保存に失敗しました', 'error');
                updateStats();
                return false;
            }
            updateStats();
            return true;
        }

        function updateStats() {
            const now = new Date();
            const month = now.getMonth();
            const year = now.getFullYear();
            const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const totalChars = entries.reduce((sum, e) => sum + (e.content || '').length, 0);
            const thisMonthEntries = entries.filter(e => {
                const d = new Date(e.date + 'T00:00:00');
                return d.getMonth() === month && d.getFullYear() === year;
            }).length;
            const weekEntries = entries.filter(e => new Date(e.date + 'T00:00:00') >= sevenDaysAgo).length;
            const weeklyAvg = (weekEntries / 7).toFixed(1);
            document.getElementById('totalEntries').textContent = entries.length;
            document.getElementById('totalChars').textContent = totalChars.toLocaleString('ja-JP');
            document.getElementById('thisMonthEntries').textContent = thisMonthEntries;
            document.getElementById('weeklyAvg').textContent = weeklyAvg;
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view-tab').forEach(t => {
                const on = t.dataset.view === view;
                t.classList.toggle('active', on);
                t.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            const calOn = view === 'calendar';
            document.getElementById('calendarView').classList.toggle('active', calOn);
            document.getElementById('listView').classList.toggle('active', !calOn);
            if (calOn) renderCalendar(); else renderEntriesList();
        }

        function renderCalendar() {
            const title = document.getElementById('calendarTitle');
            const daysContainer = document.getElementById('calendarDays');
            title.textContent = `${currentYear}年 ${currentMonth + 1}月`;
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const prevLastDay = new Date(currentYear, currentMonth, 0);
            const firstDayOfWeek = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            const prevDaysInMonth = prevLastDay.getDate();
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            const entriesMap = {};
            entries.forEach(entry => { entriesMap[entry.date] = entry; });
            let html = '';
            for (let i = firstDayOfWeek - 1; i >= 0; i--) {
                const day = prevDaysInMonth - i;
                html += `<div class="calendar-day other-month" aria-hidden="true">${day}</div>`;
            }
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasEntry = entriesMap[dateStr];
                const isToday = dateStr === todayStr;
                const isSelected = dateStr === selectedDate;
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (hasEntry) classes += ' has-entry';
                if (isSelected) classes += ' selected';
                const label = `${currentYear}年${currentMonth + 1}月${day}日${hasEntry ? '・日記あり' : ''}${isToday ? '・今日' : ''}`;
                html += `<button type="button" class="${classes}" aria-label="${label}" aria-pressed="${isSelected}" onclick="selectDate('${dateStr}')">${day}</button>`;
            }
            const totalCells = firstDayOfWeek + daysInMonth;
            const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let day = 1; day <= remainingCells; day++) {
                html += `<div class="calendar-day other-month" aria-hidden="true">${day}</div>`;
            }
            daysContainer.innerHTML = html;
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        }

        async function selectDate(dateStr) {

            if (!(await ensureSavedOrConfirmLoseChanges('日付移動'))) return;
            selectedDate = dateStr;
            renderCalendar();
            const entry = entries.find(e => e.date === dateStr);
            if (entry) {
                loadEntry(entry);
            } else {
                currentEntry = null;
                renderEditor();
                showToast(`${dateStr} の日記はありません`, 'warning');
            }
        }

        function renderEntriesList() {
            const list = document.getElementById('entriesList');
            if (!list) return;
            const filtered = getFilteredEntries();
            const sorted = filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            list.innerHTML = '';
            sorted.forEach(entry => {
                const li = document.createElement('li');
                li.className = 'entry-item' + (currentEntry?.id === entry.id ? ' active' : '');
                li.innerHTML = `<div class="entry-date">${formatDate(entry.date)}</div><div class="entry-title">${escapeHtml(entry.title)}</div>`;
                li.onclick = () => loadEntry(entry);
                list.appendChild(li);
            });
            if (sorted.length === 0) { list.innerHTML = '<li style="padding: var(--space-12); color: var(--color-text-secondary); text-align: center; font-size: 12px;">該当する日記なし</li>'; }
            renderTagFilter();
        }

        function getFilteredEntries() {
            return entries.filter(entry => {
                const q = currentFilters.searchText.toLowerCase();
                const matchesSearch = q === '' || (entry.title || '').toLowerCase().includes(q) || (entry.content || '').toLowerCase().includes(q);
                const matchesTags = currentFilters.tags.length === 0 || currentFilters.tags.some(tag => (entry.tags || []).includes(tag));
                return matchesSearch && matchesTags;
            });
        }

        function filterEntries() {
            currentFilters.searchText = document.getElementById('searchInput').value;
            renderEntriesList();
        }

        function toggleTagFilter(tag) {
            const idx = currentFilters.tags.indexOf(tag);
            if (idx > -1) { currentFilters.tags.splice(idx, 1); } else { currentFilters.tags.push(tag); }
            renderEntriesList();
        }

        function renderTagFilter() {
            const list = document.getElementById('tagFilterList');
            if (!list) return;
            const allTags = [...new Set(entries.flatMap(e => e.tags || []))].sort();
            list.innerHTML = '';
            allTags.forEach(tag => {
                const isActive = currentFilters.tags.includes(tag);
                const div = document.createElement('div');
                div.className = 'tag-filter-item' + (isActive ? ' active' : '');
                div.innerHTML = `${escapeHtml(tag)} ${isActive ? '✕' : ''}`;
                div.onclick = () => toggleTagFilter(tag);
                list.appendChild(div);
            });
        }

        function loadEntry(entry) {
            currentEntry = entry;
            selectedDate = entry.date;
            renderEditor();
            if (currentView === 'calendar') renderCalendar();
            if (currentView === 'list') renderEntriesList();
        }

/* === Rich text engine (Selection/Range based; replaces execCommand) ===
   Core helpers are unit-tested; see engine.test.js in the project. */
function rteEditor() { return document.getElementById('contentEditor'); }

function rteGetRange() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return null;
  const range = sel.getRangeAt(0);
  const editor = rteEditor();
  if (!editor || !editor.contains(range.commonAncestorContainer)) return null;
  return range;
}

function rteSetSelection(range) {
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

/* ---- pure helpers (testable) ---- */

function rteIntersects(range, node) {
  const nr = node.ownerDocument.createRange();
  nr.selectNodeContents(node);
  // positive overlap: range.start < node.end AND range.end > node.start
  const startBeforeEnd = range.compareBoundaryPoints(Range.END_TO_START, nr) < 0;
  const endAfterStart = range.compareBoundaryPoints(Range.START_TO_END, nr) > 0;
  return startBeforeEnd && endAfterStart;
}

// Align range boundaries to text-node edges by splitting boundary text nodes.
function rteNormalizeBoundaries(range) {
  const T = Node.TEXT_NODE;
  const sc = range.startContainer, so = range.startOffset;
  const ec = range.endContainer, eo = range.endOffset;
  if (sc === ec && sc.nodeType === T) {
    // single text node: isolate the [so, eo) slice into its own node
    let mid = sc;
    if (so > 0) mid = sc.splitText(so);          // mid = [so, end)
    const midLen = eo - so;
    if (midLen < mid.length) mid.splitText(midLen); // mid = [so, eo)
    range.setStart(mid, 0);
    range.setEnd(mid, mid.length);
    return;
  }
  if (ec.nodeType === T && eo > 0 && eo < ec.length) {
    ec.splitText(eo);
    range.setEnd(ec, ec.length);
  }
  if (sc.nodeType === T && so > 0 && so < sc.length) {
    const after = sc.splitText(so);
    range.setStart(after, 0);
  }
}

function rteTextNodes(editor, range) {
  const out = [];
  const doc = editor.ownerDocument;
  const tw = doc.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null);
  let n;
  while ((n = tw.nextNode())) {
    if (!n.nodeValue || !n.nodeValue.length) continue;
    if (rteIntersects(range, n)) out.push(n);
  }
  return out;
}

function rteClosest(editor, node, tagName) {
  let el = (node && node.nodeType === Node.TEXT_NODE) ? node.parentNode : node;
  while (el && el !== editor) {
    if (el.tagName === tagName) return el;
    el = el.parentNode;
  }
  return null;
}

function rteClosestBlock(editor, node) {
  let el = (node && node.nodeType === Node.TEXT_NODE) ? node.parentNode : node;
  const B = /^(DIV|P|LI|BLOCKQUOTE|H[1-6]|PRE)$/;
  while (el && el !== editor) {
    if (el.nodeType === 1 && B.test(el.tagName)) return el;
    el = el.parentNode;
  }
  return null;
}

const rteInlineAncestor = rteClosest;

function rteWrap(editor, node, tagName) {
  const w = editor.ownerDocument.createElement(tagName);
  node.parentNode.insertBefore(w, node);
  w.appendChild(node);
  return w;
}

// Pull `node`'s subtree out of an ancestor <tagName>, preserving siblings
// (and inner formatting) on either side inside cloned wrappers.
function rteSplitOutOf(wrapper, node) {
  const doc = wrapper.ownerDocument;
  const parent = wrapper.parentNode;
  let pathChild = node;
  while (pathChild.parentNode !== wrapper) pathChild = pathChild.parentNode;

  const out = doc.createDocumentFragment();
  if (pathChild.previousSibling) {
    const lw = doc.createElement(wrapper.tagName);
    while (wrapper.firstChild && wrapper.firstChild !== pathChild) lw.appendChild(wrapper.firstChild);
    out.appendChild(lw);
  }
  out.appendChild(pathChild); // move the node's subtree out as-is
  if (wrapper.firstChild) {    // whatever remains is after pathChild
    const rw = doc.createElement(wrapper.tagName);
    while (wrapper.firstChild) rw.appendChild(wrapper.firstChild);
    out.appendChild(rw);
  }
  parent.replaceChild(out, wrapper);
}

function rteUnwrapNode(editor, node, tagName) {
  let wrapper = rteInlineAncestor(editor, node, tagName);
  let guard = 0;
  while (wrapper && guard++ < 50) {
    rteSplitOutOf(wrapper, node);
    wrapper = rteInlineAncestor(editor, node, tagName);
  }
}

// Toggle an inline tag over an explicit range (mutates DOM; no selection change).
function rteApplyInlineToRange(editor, range, tagName) {
  rteNormalizeBoundaries(range);
  const nodes = rteTextNodes(editor, range);
  if (!nodes.length) return;
  const allFormatted = nodes.every(n => rteInlineAncestor(editor, n, tagName));
  if (allFormatted) {
    nodes.forEach(n => rteUnwrapNode(editor, n, tagName));
  } else {
    nodes.forEach(n => { if (!rteInlineAncestor(editor, n, tagName)) rteWrap(editor, n, tagName); });
  }
}

// Character offset within editor of a boundary point (container, offset).
function rteOffset(editor, container, offset) {
  const r = editor.ownerDocument.createRange();
  r.setStart(editor, 0);
  r.setEnd(container, offset);
  return r.toString().length;
}

// Map a character offset back to a {node, offset} text position.
function rteFindOffset(editor, target) {
  let p = 0;
  const doc = editor.ownerDocument;
  const w = doc.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null);
  let node, last = null;
  while ((node = w.nextNode())) {
    const l = node.nodeValue.length;
    last = node;
    if (p + l >= target) return { node, offset: target - p };
    p += l;
  }
  if (last) return { node: last, offset: last.nodeValue.length };
  return { node: editor, offset: 0 };
}

function rteSetSelectionByOffsets(editor, start, end) {
  const doc = editor.ownerDocument;
  const s = rteFindOffset(editor, start);
  const e = rteFindOffset(editor, end);
  const r = doc.createRange();
  try {
    r.setStart(s.node, s.offset);
    r.setEnd(e.node, e.offset);
  } catch (_) { return; }
  rteSetSelection(r);
}

// Tidy the tree: drop empty inline elements, merge adjacent same-tag inlines.
function rteNormalize(editor) {
  const inlineSet = new Set(['STRONG', 'EM', 'S', 'B', 'I', 'U']);
  let changed = true, guard = 0;
  while (changed && guard++ < 100) {
    changed = false;
    const els = Array.from(editor.querySelectorAll('strong,em,s,b,i,u,a'));
    for (const el of els) {
      if (!el.textContent) { el.remove(); changed = true; continue; }
      const next = el.nextSibling;
      if (next && next.nodeType === 1 && next.tagName === el.tagName && inlineSet.has(el.tagName)) {
        while (next.firstChild) el.appendChild(next.firstChild);
        next.remove();
        changed = true;
      }
    }
  }
  editor.normalize();
}

// Split a fragment's children into "lines" (by <br> and block elements).
function rteSplitFragmentIntoLines(frag, doc) {
  const groups = [];
  let cur = [];
  Array.from(frag.childNodes).forEach(node => {
    if (node.nodeType === 1 && node.tagName === 'BR') {
      groups.push(cur); cur = [];
    } else if (node.nodeType === 1 && /^(DIV|P)$/.test(node.tagName)) {
      if (cur.length) { groups.push(cur); cur = []; }
      groups.push(Array.from(node.childNodes));
    } else {
      cur.push(node);
    }
  });
  if (cur.length) groups.push(cur);
  return groups.filter(g => g.length > 0);
}

// Wrap an explicit range's contents in a block structure (ul/li or blockquote).
function rteWrapBlockRange(editor, range, kind) {
  const doc = editor.ownerDocument;
  const frag = range.extractContents();
  let wrapper;
  if (kind === 'ul') {
    wrapper = doc.createElement('ul');
    const groups = rteSplitFragmentIntoLines(frag, doc);
    if (!groups.length) {
      wrapper.appendChild(doc.createElement('li'));
    } else {
      groups.forEach(group => {
        const li = doc.createElement('li');
        group.forEach(nd => li.appendChild(nd));
        wrapper.appendChild(li);
      });
    }
  } else {
    wrapper = doc.createElement('blockquote');
    wrapper.appendChild(frag);
  }
  range.insertNode(wrapper);
  return wrapper;
}

function rteUnwrapBlock(editor, existing, kind) {
  const doc = editor.ownerDocument;
  if (kind === 'ul') {
    const list = (existing.closest ? existing.closest('ul,ol') : null) || existing.parentNode;
    if (!list) return;
    const frag = doc.createDocumentFragment();
    Array.from(list.children).forEach(li => {
      const div = doc.createElement('div');
      while (li.firstChild) div.appendChild(li.firstChild);
      frag.appendChild(div);
    });
    list.parentNode.replaceChild(frag, list);
  } else {
    const bq = existing;
    const frag = doc.createDocumentFragment();
    while (bq.firstChild) frag.appendChild(bq.firstChild);
    bq.parentNode.replaceChild(frag, bq);
  }
}

/* ---- UI wrappers (browser-only; not unit-tested) ---- */

function rteInsertEmptyInline(editor, tagName) {
  const range = rteGetRange();
  if (!range) return;
  const el = editor.ownerDocument.createElement(tagName);
  el.appendChild(editor.ownerDocument.createTextNode('\u200B'));
  range.deleteContents();
  range.insertNode(el);
  const r = editor.ownerDocument.createRange();
  r.setStart(el.firstChild, 1);
  r.collapse(true);
  rteSetSelection(r);
}

function rteToggleInline(tagName) {
  const editor = rteEditor();
  if (!editor) return;
  editor.focus();
  const range = rteGetRange();
  if (!range) return;
  if (range.collapsed) { rteInsertEmptyInline(editor, tagName); syncEditorContent(); return; }
  const startOff = rteOffset(editor, range.startContainer, range.startOffset);
  const endOff = rteOffset(editor, range.endContainer, range.endOffset);
  rteApplyInlineToRange(editor, range, tagName);
  rteNormalize(editor);
  rteSetSelectionByOffsets(editor, startOff, endOff);
  syncEditorContent();
}

function rteToggleBlock(kind) {
  const editor = rteEditor();
  if (!editor) return;
  editor.focus();
  const range = rteGetRange();
  if (!range) return;

  const probe = kind === 'ul' ? 'LI' : 'BLOCKQUOTE';
  const existing = rteClosest(editor, range.startContainer, probe);
  if (existing) {
    rteUnwrapBlock(editor, existing, kind);
    rteNormalize(editor);
    syncEditorContent();
    return;
  }

  let workRange = range;
  let expanded = false;
  if (range.collapsed) {
    const block = rteClosestBlock(editor, range.startContainer) || editor;
    workRange = editor.ownerDocument.createRange();
    workRange.selectNodeContents(block);
    expanded = true;
  }
  const startOff = rteOffset(editor, workRange.startContainer, workRange.startOffset);
  const endOff = rteOffset(editor, workRange.endContainer, workRange.endOffset);
  rteWrapBlockRange(editor, workRange, kind);
  rteNormalize(editor);
  if (!expanded) rteSetSelectionByOffsets(editor, startOff, endOff);
  syncEditorContent();
}

function rteCreateLink() {
  const editor = rteEditor();
  if (!editor) return;
  editor.focus();
  const range = rteGetRange();
  if (!range) return;
  const url = prompt('リンク先URLを入力', 'https://');
  if (!url) return;
  const trimmed = url.trim();
  if (!/^(https?:|mailto:|tel:)/i.test(trimmed)) {
    showToast('http(s):, mailto:, tel: のみ使用できます', 'error');
    return;
  }
  const a = editor.ownerDocument.createElement('a');
  a.setAttribute('href', trimmed);
  a.setAttribute('target', '_blank');
  a.setAttribute('rel', 'noopener noreferrer');
  if (range.collapsed) {
    a.textContent = trimmed;
    range.insertNode(a);
  } else {
    try {
      a.appendChild(range.extractContents());
      range.insertNode(a);
    } catch (e) { console.error(e); return; }
  }
  rteNormalize(editor);
  syncEditorContent();
}


function insertHtmlAtCursor(html) {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  range.deleteContents();

  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const node = tpl.content;

  range.insertNode(node);
  sel.collapseToEnd();
}

        // 取り込んだHTMLを安全化（許可属性のみ・危険タグ/イベント/スキームを除去）：#5
        const SANITIZE_ALLOWED_ATTR = new Set(['href', 'target', 'rel']);
        const SANITIZE_DANGEROUS_TAGS = 'script,style,iframe,object,embed,link,meta,base,form,input,textarea,button,select,option,svg,math,noscript,title,frame,frameset,applet,audio,video,source,track,img,picture,canvas';
        function sanitizeHtml(dirty) {
            // <template> はパース時にスクリプト実行・リソース読込をしない安全なコンテナ
            const tpl = document.createElement('template');
            tpl.innerHTML = String(dirty == null ? '' : dirty);
            const root = tpl.content;
            root.querySelectorAll(SANITIZE_DANGEROUS_TAGS).forEach(el => el.remove());
            root.querySelectorAll('*').forEach(el => {
                Array.from(el.attributes).forEach(attr => {
                    const name = attr.name.toLowerCase();
                    if (name.startsWith('on') || !SANITIZE_ALLOWED_ATTR.has(name)) {
                        el.removeAttribute(attr.name);
                        return;
                    }
                    if (name === 'href') {
                        const ok = /^\s*(https?:|mailto:|tel:|#)/i.test(attr.value || '');
                        if (!ok) el.removeAttribute(attr.name);
                    }
                });
                if (el.tagName === 'A') {
                    el.setAttribute('target', '_blank');
                    el.setAttribute('rel', 'noopener noreferrer');
                }
            });
            const out = document.createElement('div');
            out.appendChild(root.cloneNode(true));
            return out.innerHTML;
        }

                id: String(entry.id),

                title: typeof entry.title === 'string' ? entry.title : '',
                content: fmt === 'plain' ? String(entry.content || '') : sanitizeHtml(entry.content || ''),
                contentFormat: fmt,
                tags: Array.isArray(entry.tags) ? entry.tags.filter(t => typeof t === 'string') : [],
                createdAt: entry.createdAt || new Date().toISOString(),

        async function applyPassphrase() {

            const wasEnabled = encEnabled, prevKey = cryptoKey, prevMeta = encMeta;
            try {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const key = await ENC.deriveKey(p1, salt, PBKDF2_ITER);
                cryptoKey = key;
                encEnabled = true;
                encMeta = { salt: ENC.b64(salt), iter: PBKDF2_ITER };

function sharedTokenGet(){ try{ var o=JSON.parse(localStorage.getItem('shared:gd:token')||'null'); if(o&&o.token&&Date.now()<o.exp-60000) return o.token; }catch(e){} return null; }
function sharedTokenSet(t,exp){ try{ localStorage.setItem('shared:gd:token', JSON.stringify({token:t, exp:Date.now()+((exp||3600)*1000)})); }catch(e){} }
function sharedTokenClear(){ try{ localStorage.removeItem('shared:gd:token'); }catch(e){} }

let driveTokenClient = null;
let driveAccessToken = null;
let autoSyncDriveEnabled = false;

function initDriveTokenClient() {
  if (driveTokenClient) return;
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    showToast('Google認証ライブラリ未読込', 'warning');
    return;
  }
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVECLIENTID,
    scope: DRIVESCOPE,
    callback: () => {},
    error_callback: () => showToast('Drive認証エラー', 'error')
  });
}

function driveRequestToken(promptMode) {
  return new Promise((resolve, reject) => {
    initDriveTokenClient();
    if (!driveTokenClient) return reject(new Error('tokenClient not ready'));
    driveTokenClient.callback = (resp) => {
      if (resp && resp.access_token) {
        driveAccessToken = resp.access_token;
        sharedTokenSet(resp.access_token, resp.expires_in);
        resolve(driveAccessToken);
      } else {
        reject(resp);
      }
    };
    driveTokenClient.requestAccessToken({ prompt: promptMode });
  });
}

async function driveEnsureToken(interactive = false) {
  if (driveAccessToken) return driveAccessToken;
  var shared = sharedTokenGet();
  if (shared) { driveAccessToken = shared; return shared; }
  return await driveRequestToken(interactive ? 'consent' : '');
}

async function driveFetch(url, options = {}, _retried = false) {
  const token = await driveEnsureToken(false);
  const res = await fetch(url, {
    ...options,
    headers: {
      Authorization: `Bearer ${token}`,
      ...(options.headers || {})
    }
  });
  if (res.status === 401 && !_retried) {
    // トークン期限切れ等。再取得して一度だけ再試行（#9）
    driveAccessToken = null;
    sharedTokenClear();
    await driveRequestToken('');
    return driveFetch(url, options, true);
  }
  if (!res.ok) throw new Error(await res.text());
  return res;
}

async function driveFindDiaryFileId() {
  const q = encodeURIComponent(`name="${DRIVEDIARYFILENAME}" and trashed=false`);
  const fields = encodeURIComponent('files(id,name,modifiedTime)');
  const res = await driveFetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=${fields}`
  );
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function driveDownloadDiary() {
  const fileId = await driveFindDiaryFileId();
  if (!fileId) return null;
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  const txt = await res.text();
  return JSON.parse(txt);
}

function mergeEntriesByUpdatedAt(localEntries, incomingEntries) {
  const map = new Map();
  localEntries.forEach(e => map.set(e.id, e));
  let added = 0, updated = 0;

  incomingEntries.forEach(e => {
    const cur = map.get(e.id);
    if (!cur) {
      map.set(e.id, e);
      added++;
      return;
    }
    const t1 = new Date(cur.updatedAt || cur.createdAt || 0).getTime();
    const t2 = new Date(e.updatedAt || e.createdAt || 0).getTime();
    if (t2 > t1) {
      map.set(e.id, e);
      updated++;
    }
  });

  return { merged: Array.from(map.values()), added, updated };
}

async function drivePullAndMerge() {
  try {
    await driveEnsureToken(true);
    const raw = await driveDownloadDiary();
    if (!raw) {
      showToast('Driveに diary.json がありません', 'warning');
      return;
    }
    let data = raw;
    if (isEncBlob(raw)) {
      const json = await decryptIncomingBlob(raw); // 必要ならパスフレーズを要求
      data = JSON.parse(json);
    }
    if (!data || !Array.isArray(data.entries)) {
      showToast('Driveのデータ形式が不正です', 'warning');
      return;
    }
    // Drive由来データも信頼せずサニタイズ・正規化してからマージ（#5）
    const incoming = data.entries.map(normalizeImportedEntry);
    const r = mergeEntriesByUpdatedAt(entries, incoming);
    entries = r.merged;
    await saveEntriesToStorage();
    renderCalendar();
    renderEntriesList();
    renderEditor();
    showToast(`Drive: 追加${r.added} 更新${r.updated}`, 'success');
  } catch (err) {
    console.error(err);
    showToast(err && err.message === 'cancelled' ? 'ロック解除をキャンセルしました' : 'Drive 読み込み失敗', err && err.message === 'cancelled' ? 'warning' : 'error');
  }
}

async function driveUploadDiaryObject(obj) {
  const fileId = await driveFindDiaryFileId();

  const metadata = fileId
    ? { name: DRIVEDIARYFILENAME }
    : { name: DRIVEDIARYFILENAME, parents: ['appDataFolder'] };

  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));

  let token = await driveEnsureToken(false);
  const url = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const method = fileId ? 'PATCH' : 'POST';

  let res = await fetch(url, { method, headers: { Authorization: `Bearer ${token}` }, body: form });
  if (res.status === 401) {
    // トークン期限切れ等。再取得して一度だけ再試行（#9）
    driveAccessToken = null;
    token = await driveRequestToken('');
    res = await fetch(url, { method, headers: { Authorization: `Bearer ${token}` }, body: form });
  }
  if (!res.ok) throw new Error(await res.text());
  return await res.json();
}

/* --------------------- attachments (IndexedDB) -------------------- */

const IDB_NAME = "kininari", IDB_STORE = "files";
let _idb = null;
function idb() {
  return new Promise((resolve, reject) => {
    if (_idb) return resolve(_idb);
    try {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: "id" }); };
      req.onsuccess = () => { _idb = req.result; resolve(_idb); };
      req.onerror = () => reject(req.error);
    } catch (e) { reject(e); }
  });
}
function idbOp(mode, fn) { return idb().then((db) => new Promise((res, rej) => { const tx = db.transaction(IDB_STORE, mode); const store = tx.objectStore(IDB_STORE); const r = fn(store); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); }
const idbPut = (record) => idbOp("readwrite", (s) => s.put(record));
const idbGet = (id) => idbOp("readonly", (s) => s.get(id));
const idbDelete = (id) => idbOp("readwrite", (s) => s.delete(id));
const idbKeys = () => idbOp("readonly", (s) => s.getAllKeys());

async function gcAttachments(memos) {
  try {
    const used = new Set();
    memos.forEach((m) => (m.attachments || []).forEach((a) => used.add(a.id)));
    const keys = await idbKeys();
    for (const k of keys) if (!used.has(k)) await idbDelete(k);
  } catch (e) {}
}
function blobToDataUrl(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }

async function buildBackupObject(memos, folders) {
  const files = []; const seen = new Set();
  for (const m of memos) for (const a of (m.attachments || [])) {
    if (seen.has(a.id)) continue; seen.add(a.id);
    try { const rec = await idbGet(a.id); if (rec && rec.blob) files.push({ id: a.id, name: rec.name || a.name, type: rec.type || a.type, dataUrl: await blobToDataUrl(rec.blob) }); } catch (e) {}
  }
  return { app: "kininari", memos, notebooks: folders, files };
}
async function restoreBackupFiles(files) {
  for (const fl of (files || [])) { try { const blob = await (await fetch(fl.dataUrl)).blob(); await idbPut({ id: fl.id, blob, name: fl.name, type: fl.type, size: blob.size }); } catch (e) {} }
}

/* ----------------------- Google Drive client --------------------- */

const SHARED_GD_CID = "312868081144-nsjo9gfkm94ol1pha2nhq913g9p1m4e0.apps.googleusercontent.com";
const GD_SCOPE = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata";
const GD_FILE_NAME = "kininari-data.json";
function sharedTokenGet(){ try{ var o=JSON.parse(localStorage.getItem('shared:gd:token')||'null'); if(o&&o.token&&Date.now()<o.exp-60000) return o.token; }catch(e){} return null; }
function sharedTokenSet(t,exp){ try{ localStorage.setItem('shared:gd:token', JSON.stringify({token:t, exp:Date.now()+((exp||3600)*1000)})); }catch(e){} }
function sharedTokenClear(){ try{ localStorage.removeItem('shared:gd:token'); }catch(e){} }
let _gdClient = null, _gdToken = null, _gdExp = 0, _gdCid = null;
function gisReady() { return typeof google !== "undefined" && google.accounts && google.accounts.oauth2; }
function gdGetToken(clientId, interactive) {
  return new Promise((resolve, reject) => {
    clientId = SHARED_GD_CID;
    const shared = sharedTokenGet();
    if (shared && !interactive) return resolve(shared);
    if (!gisReady()) return reject(new Error("Googleの読み込みが未完了です。少し待って再度お試しください。"));
    if (_gdToken && Date.now() < _gdExp - 60000 && _gdCid === clientId) return resolve(_gdToken);
    if (!_gdClient || _gdCid !== clientId) { _gdClient = google.accounts.oauth2.initTokenClient({ client_id: clientId, scope: GD_SCOPE, callback: () => {} }); _gdCid = clientId; }
    _gdClient.callback = (resp) => { if (resp && resp.access_token) { _gdToken = resp.access_token; _gdExp = Date.now() + ((resp.expires_in || 3600) * 1000); sharedTokenSet(resp.access_token, resp.expires_in); resolve(_gdToken); } else reject(new Error("認証に失敗しました")); };
    try { _gdClient.requestAccessToken({ prompt: interactive ? "consent" : "" }); } catch (e) { reject(e); }
  });
}
async function gdFindFile(token) {
  const q = encodeURIComponent(`name='${GD_FILE_NAME}' and trashed=false`);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,modifiedTime)&pageSize=10`, { headers: { Authorization: "Bearer " + token } });
  if (!r.ok) throw new Error("Drive 検索に失敗 (" + r.status + ")");
  const j = await r.json();
  return (j.files && j.files[0]) ? j.files[0] : null;
}
async function gdCreate(token, content) {
  const boundary = "kininari" + Date.now();
  const meta = { name: GD_FILE_NAME, mimeType: "application/json" };
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime", { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "multipart/related; boundary=" + boundary }, body });
  if (!r.ok) throw new Error("Drive 作成に失敗 (" + r.status + ")");
  return r.json();
}
async function gdUpdate(token, id, content) {
  const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id,modifiedTime`, { method: "PATCH", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: content });
  if (!r.ok) throw new Error("Drive 更新に失敗 (" + r.status + ")");
  return r.json();
}
async function gdDownload(token, id) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers: { Authorization: "Bearer " + token } });
  if (!r.ok) throw new Error("Drive 取得に失敗 (" + r.status + ")");
  return r.text();
}
async function gdGetMeta(token, id) {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?fields=id,modifiedTime`, { headers: { Authorization: "Bearer " + token } });
  if (!r.ok) throw new Error("Drive 情報取得に失敗 (" + r.status + ")");
  return r.json();
}

const isImg = (t) => (t || "").startsWith("image/");
function bytes(n) { if (n == null) return ""; if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(0) + " KB"; return (n / 1048576).toFixed(1) + " MB"; }
const FileGlyph = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"><path d="M14 3v5h5" /><path d="M7 3h8l5 5v11a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" /></svg>);

function useAttachmentUrls(attachments) {
  const [urls, setUrls] = useState({});
  const ref = useRef({});
  const idsKey = (attachments || []).map((a) => a.id).join(",");
  useEffect(() => {
    let alive = true;
    const ids = (attachments || []).map((a) => a.id);
    Object.keys(ref.current).forEach((id) => { if (!ids.includes(id)) { URL.revokeObjectURL(ref.current[id]); delete ref.current[id]; } });
    const missing = ids.filter((id) => !ref.current[id]);
    if (missing.length === 0) { setUrls({ ...ref.current }); return; }
    (async () => {
      for (const id of missing) { try { const rec = await idbGet(id); if (rec && rec.blob) ref.current[id] = URL.createObjectURL(rec.blob); } catch (e) {} }
      if (alive) setUrls({ ...ref.current });
    })();
    return () => { alive = false; };
  }, [idsKey]);
  useEffect(() => () => { Object.values(ref.current).forEach((u) => URL.revokeObjectURL(u)); ref.current = {}; }, []);
  return urls;
}

function AttachmentList({ attachments, urls, editable, onRemove, onView }) {
  if (!attachments || attachments.length === 0) return null;
  return (

          {urls[a.id] ? <img src={urls[a.id]} alt={a.name} onClick={() => onView && onView(urls[a.id])} /> : <div className="att-ph" />}
          {editable && <button className="att-x" onClick={() => onRemove(a.id)} aria-label="削除">×</button>}
        </div>
      ) : (
        <div className="att-file" key={a.id}>
          {urls[a.id]
            ? <a href={urls[a.id]} download={a.name} target="_blank" rel="noopener noreferrer" className="att-file-main"><FileGlyph /><span className="att-name">{a.name}</span><span className="att-size">{bytes(a.size)}</span></a>
            : <span className="att-file-main"><FileGlyph /><span className="att-name">{a.name}</span></span>}
          {editable && <button className="att-x file" onClick={() => onRemove(a.id)} aria-label="削除">×</button>}
        </div>
      ))}

async function ingestFiles(fileList) {
  const out = [];
  for (const file of Array.from(fileList || [])) {
    const id = uid();
    const name = file.name || ((file.type || "").startsWith("image/") ? "貼り付け画像.png" : "file");
    try { await idbPut({ id, blob: file, name, type: file.type || "", size: file.size }); out.push({ id, name, type: file.type || "", size: file.size }); } catch (err) {}
  }
  return out;
}

function dropPasteHandlers(append) {
  return {
    onPaste: async (e) => {
      const picked = [];
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) { if (it.kind === "file") { const f = it.getAsFile(); if (f) picked.push(f); } }
      if (picked.length) { const added = await ingestFiles(picked); if (added.length) append(added); }
    },
    onDragOver: (e) => { try { if (Array.from(e.dataTransfer.types || []).indexOf("Files") !== -1) e.preventDefault(); } catch (x) {} },
    onDrop: async (e) => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) { e.preventDefault(); const added = await ingestFiles(e.dataTransfer.files); if (added.length) append(added); } },
  };
}

function AttachmentEditor({ attachments, onChange }) {
  const urls = useAttachmentUrls(attachments);
  const [busy, setBusy] = useState(false);
  const onPick = async (e) => {
    const files = Array.from(e.target.files || []); e.target.value = "";
    if (!files.length) return;
    setBusy(true);
    const added = await ingestFiles(files);
    setBusy(false);
    if (added.length) onChange([...(attachments || []), ...added]);
  };
  const remove = (id) => onChange((attachments || []).filter((a) => a.id !== id));
  return (
    <div className="att-editor">
      <AttachmentList attachments={attachments} urls={urls} editable onRemove={remove} />
      <label className="att-add">{busy ? "追加中…" : "＋ 画像・ファイルを追加"}<input type="file" multiple onChange={onPick} disabled={busy} /></label>
    </div>
  );
}

  const [fid, setFid] = useState(memo.notebookId);

  const [time, setTime] = useState(memo.time);
  const [remind, setRemind] = useState(memo.remind ?? null);
  const [attachments, setAttachments] = useState(memo.attachments || []);

        <button className="tree-more" onClick={() => onActions(folder.id)} aria-label="操作">⋯</button>
      </div>
      {open && kids.map((k) => (
        <TreeNode key={k.id} folder={k} depth={depth + 1} folders={folders} memos={memos} expanded={expanded} onToggle={onToggle} active={active} onSelect={onSelect} onActions={onActions} />
      ))}
    </div>
  );
}

function FolderTreeContent({ folders, memos, expanded, onToggle, active, onSelect, onActions, onAddRoot }) {
  const [adding, setAdding] = useState(false);
  const [val, setVal] = useState("");
  const roots = folders.filter((f) => (f.parentId || null) === null).sort((a, b) => a.createdAt - b.createdAt);
  const pinned = folders.filter((f) => f.pinned);
  const commit = () => { if (val.trim()) onAddRoot(val.trim()); setVal(""); setAdding(false); };
  return (
    <React.Fragment>
      <button className={"tree-row root" + (active == null ? " active" : "")} onClick={() => onSelect(null)}>
        <span className="all-ic">✦</span><span className="nm">すべて</span>
      </button>

      {pinned.length > 0 && (
        <React.Fragment>
          <div className="drawer-label"><span className="pinmark sm"><PinIcon /></span>ピン留め</div>
          {pinned.map((f) => (
            <button key={f.id} className={"pinned-row" + (active === f.id ? " active" : "")} onClick={() => onSelect(f.id)}>
              <span className="dot" style={{ background: f.color }} /><span className="nm">{f.name}</span>
            </button>
          ))}
        </React.Fragment>
      )}

      <div className="drawer-label">すべてのフォルダ</div>
      {roots.length === 0 ? (
        <p className="drawer-empty">まだフォルダがありません。下のボタンから作れます。</p>
      ) : (
        roots.map((f) => (
          <TreeNode key={f.id} folder={f} depth={0} folders={folders} memos={memos} expanded={expanded} onToggle={onToggle} active={active} onSelect={onSelect} onActions={onActions} />
        ))
      )}

      {adding ? (
        <div className="add-root-form">
          <input autoFocus value={val} placeholder="フォルダ名" onChange={(e) => setVal(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") { setAdding(false); setVal(""); } }} />
          <button className="btn solid small" onClick={commit}>追加</button>
          <button className="btn ghost small" onClick={() => { setAdding(false); setVal(""); }}>×</button>
        </div>
      ) : (
        <button className="add-root" onClick={() => setAdding(true)}>＋ 新しいフォルダ</button>
      )}
    </React.Fragment>
  );
}

/* ----------------------------- AI panel --------------------------- */

const AI_SYS = "あなたはユーザーの個人メモを整理するアシスタントです。返答は指定どおりのJSONオブジェクトだけを出力し、前置き・説明・Markdownのコードフェンスは一切つけないでください。日本語で簡潔に。";
const AI_INSTR = `次のメモ一覧を整理してください。各メモは id / title / body / category / tags を持ちます。

以下の形のJSONだけを返してください:
{
  "summary": "全体で何が気になっているか・どんなテーマがあるかの要約（2〜3文、日本語）",
  "tags": { "メモのid": ["短いタグ", "..."] },
  "groups": [ { "name": "フォルダ名（短い日本語）", "ids": ["id", "..."] } ]
}

ルール:
- tags は各メモに1〜3個。既存の tags を優先して再利用し、足りなければ簡潔な日本語タグ（1〜4文字程度）を追加。
- groups は関連するメモを2〜4個のグループにまとめる。各グループは必ず2件以上。すべてを無理にまとめなくてよい。
- id は必ず入力のものをそのまま使う。

メモ一覧:
`;

function AIPanel({ memos, folders, apiKey, onSaveKey, onClose, onApplyTag, onApplyAllTags, onCreateGroup }) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);
  const [groupsDone, setGroupsDone] = useState({});
  const [editKey, setEditKey] = useState(false);
  const [keyInput, setKeyInput] = useState(apiKey || "");
  const byId = useMemo(() => Object.fromEntries(memos.map((m) => [m.id, m])), [memos]);
  const showKeyForm = !apiKey || editKey;

  const run = async (k) => {
    const key = k || apiKey;
    if (!key) { setEditKey(true); return; }
    setLoading(true); setError(null);
    try {
      const compact = memos.slice(0, 40).map((m) => ({ id: m.id, title: m.title, body: (m.body || "").slice(0, 120), category: m.category, tags: m.tags || [] }));
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model: AI_MODEL, max_tokens: 1000, system: AI_SYS, messages: [{ role: "user", content: AI_INSTR + JSON.stringify(compact) }] }),
      });
      const data = await res.json();
      if (data.error) { setError((data.error.message || "APIエラー") + "（キーやモデル名をご確認ください）"); setLoading(false); return; }
      const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
      const clean = text.replace(/```json/g, "").replace(/```/g, "").trim();
      const parsed = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
      setResult({ summary: parsed.summary || "", tags: parsed.tags || {}, groups: Array.isArray(parsed.groups) ? parsed.groups : [] });
    } catch (e) { setError("整理に失敗しました。通信状況やAPIキーをご確認のうえ、もう一度お試しください。"); }
    setLoading(false);
  };

  useEffect(() => { if (apiKey) run(apiKey); /* eslint-disable-next-line */ }, []);

  const tagRows = result ? memos.map((m) => ({ memo: m, sug: (result.tags[m.id] || []).filter((t) => t && !(byId[m.id]?.tags || []).includes(t)) })).filter((r) => r.sug.length > 0) : [];
  const allSuggested = {};
  tagRows.forEach((r) => { allSuggested[r.memo.id] = r.sug; });

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><h2 className="ai-title"><SparkIcon />AIで整理</h2><button className="modal-close" onClick={onClose}>×</button></div>
        <div className="modal-body">
          {showKeyForm ? (
            <div className="ai-key">
              <h3>AI整理を使う</h3>
              <p className="ai-note">AnthropicのAPIキーが必要です。キーは<b>このブラウザ内（localStorage）にだけ</b>保存され、Anthropic以外へ送信されません。共有のPCでは入力しないでください。</p>
              <input type="password" value={keyInput} placeholder="sk-ant-..." onChange={(e) => setKeyInput(e.target.value)} />
              <div className="edit-actions">
                {apiKey && <button className="btn ghost" onClick={() => setEditKey(false)}>戻る</button>}
                <button className="btn solid" disabled={!keyInput.trim()} onClick={() => { const k = keyInput.trim(); onSaveKey(k); setEditKey(false); run(k); }}>保存して整理</button>
              </div>
              <p className="ai-foot">キーは <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">Anthropic Console</a> で取得できます。</p>
            </div>
          ) : loading ? (
            <div className="ai-loading"><div className="spinner" /><p>メモを読みこんで整理しています…</p></div>
          ) : error ? (
            <div className="ai-error"><p>{error}</p><div className="edit-actions"><button className="btn ghost" onClick={() => setEditKey(true)}>APIキーを変更</button><button className="btn solid" onClick={() => run()}>もう一度ためす</button></div></div>
          ) : result ? (
            <React.Fragment>
              {result.summary && <div className="ai-sec"><h3>いま気になっていること</h3><div className="ai-summary">{result.summary}</div></div>}
              <div className="ai-sec">
                <h3>タグの提案</h3>
                {tagRows.length === 0 ? <p className="ai-note">新しく提案できるタグはありませんでした。</p> : (
                  <React.Fragment>
                    {tagRows.map(({ memo, sug }) => (
                      <div className="ai-tagrow" key={memo.id}>
                        <div className="t">{memo.title}</div>
                        <div className="tag-suggest">
                          {sug.map((tg) => { const applied = (byId[memo.id]?.tags || []).includes(tg); return (<button key={tg} className={"tag-chip " + (applied ? "applied" : "ghost")} disabled={applied} onClick={() => onApplyTag(memo.id, tg)}>{applied ? "✓ " : "+ "}#{tg}</button>); })}
                        </div>
                      </div>
                    ))}
                    <button className="btn solid apply-all" onClick={() => onApplyAllTags(allSuggested)}>提案タグをすべて適用</button>
                  </React.Fragment>
                )}
              </div>
              <div className="ai-sec">
                <h3>フォルダの提案</h3>
                {result.groups.length === 0 ? <p className="ai-note">まとめられそうなグループはありませんでした。</p> : (
                  result.groups.map((g, i) => {
                    const members = (g.ids || []).map((id) => byId[id]).filter(Boolean);
                    if (members.length < 2) return null;
                    const done = groupsDone[i];
                    return (
                      <div className="ai-grp" key={i}>
                        <div className="gname"><span className="dot" style={{ background: NB_COLORS[(folders.length + i) % NB_COLORS.length] }} />{g.name}</div>
                        <div className="gmembers">{members.map((m) => m.title).join(" ・ ")}</div>
                        {done ? <span className="applied-note">✓ フォルダを作成しました</span> : <button className="btn ghost small" onClick={() => { onCreateGroup(g.name, members.map((m) => m.id)); setGroupsDone((s) => ({ ...s, [i]: true })); }}>このフォルダを作って移動</button>}
                      </div>
                    );
                  })
                )}
              </div>
              <p className="ai-foot">提案はそのまま採用してもOK。 <button className="linklike" onClick={() => setEditKey(true)}>APIキーを変更</button></p>
            </React.Fragment>
          ) : null}
        </div>
      </div>
    </div>
  );
}
