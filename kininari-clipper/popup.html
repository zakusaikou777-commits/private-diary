<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
  :root { --paper:#f4ecda; --card:#fbf6ea; --ink:#2c2620; --red:#c0463c; --line:#e2d6bd; --soft:#9a8c72; }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif; background: var(--paper); color: var(--ink); }
  .wrap { padding: 12px 13px 14px; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .seal { width: 26px; height: 26px; border-radius: 7px; background: var(--red); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .head h1 { font-size: 14px; margin: 0; }
  label.l { display: block; font-size: 11px; color: var(--soft); margin: 9px 0 3px; }
  input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 8px 9px; font-size: 13px; background: #fff; color: var(--ink); font-family: inherit; }
  textarea { resize: vertical; min-height: 54px; line-height: 1.5; }
  .url { font-size: 11px; color: var(--soft); word-break: break-all; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-height: 46px; overflow: auto; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .save { flex: 1; border: 0; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: 700; background: var(--red); color: #fff; cursor: pointer; }
  .save:disabled { opacity: .6; cursor: default; }
  .gear { border: 1px solid var(--line); background: #fff; border-radius: 10px; width: 40px; height: 40px; cursor: pointer; font-size: 16px; }
  .status { font-size: 12px; color: #2e7d52; min-height: 16px; margin-top: 8px; }
  .status.err { color: var(--red); }
  .settings { margin-top: 10px; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; background: var(--card); display: none; }
  .settings.open { display: block; }
  .settings p { font-size: 11px; color: var(--soft); margin: 0 0 6px; line-height: 1.5; }
  .hint { font-size: 10.5px; color: var(--soft); margin-top: 4px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="seal">気</div><h1>気になり帳に保存</h1></div>

  <label class="l">タイトル</label>
  <input id="title" type="text" placeholder="タイトル" />

  <label class="l">URL</label>
  <div id="url" class="url"></div>

  <label class="l">メモ（任意）</label>
  <textarea id="note" placeholder="ひとことメモ。ページで文章を選択していると自動で入ります。"></textarea>

  <label class="l">分類</label>
  <select id="cat"></select>

  <label class="l">フォルダ（任意）</label>
  <input id="folder" type="text" placeholder="例: あとで読む（なければ自動で作成）" />

  <div class="row">
    <button id="save" class="save">気になり帳に保存</button>
    <button id="gear" class="gear" title="設定">⚙</button>
  </div>
  <div id="status" class="status"></div>

  <div id="settings" class="settings">
    <p>保存先の気になり帳（kininari.html）のURLを入れてください。https のホスティング先のものです。</p>
    <input id="kurl" type="text" placeholder="https://example.com/kininari.html" />
    <div class="hint">例: 結合アプリを https://yourname.github.io/app/ に置いた場合は https://yourname.github.io/app/kininari.html</div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
